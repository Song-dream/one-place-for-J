/* 近 12 周心情热力图：颜色即当天心境评分 */
function moodHeatmapSVG(moods){
  const WEEKS=12,CELL=13,GAP=3,PADL=28,PADT=18,PADR=8,PADB=22;
  const map={}; (moods||[]).forEach(m=>{ if(m&&m.date) map[m.date]=m; });
  const end=new Date(today()+'T00:00:00');
  const start=new Date(end); start.setDate(start.getDate()-(WEEKS-1)*7); start.setDate(start.getDate()-((start.getDay()+6)%7));
  let rects='',monthMarks=[],prevMonth=-1;
  const cur=new Date(start);
  for(let w=0;w<WEEKS;w++){
    const d0=new Date(start); d0.setDate(d0.getDate()+w*7);
    if(d0<=end&&d0.getMonth()!==prevMonth){ monthMarks.push({x:PADL+w*(CELL+GAP),label:(d0.getMonth()+1)+'月'}); prevMonth=d0.getMonth(); }
    for(let d=0;d<7;d++){
      if(cur>end) break;
      const ds=dstr(cur), m=map[ds], sc=m?Number(m.score):0;
      const fill=m?(MOOD_COLORS[sc]||'#9aa0ac'):'#e9ebf0';
      const title=m?`${ds}：${sc} 分 · ${MOOD_LABEL[sc]||''}`:`${ds}：未记录`;
      rects+=`<rect x="${PADL+w*(CELL+GAP)}" y="${PADT+d*(CELL+GAP)}" width="${CELL}" height="${CELL}" rx="3" fill="${fill}" opacity="${m?0.9:1}"><title>${esc(title)}</title></rect>`;
      cur.setDate(cur.getDate()+1);
    }
  }
  const W=PADL+WEEKS*(CELL+GAP)-GAP+PADR,H=PADT+7*(CELL+GAP)-GAP+PADB;
  const months=monthMarks.map(m=>`<text x="${m.x}" y="10" font-size="9.5" fill="#9aa0ac">${m.label}</text>`).join('');
  const legend=[1,3,5,7,10].map((s,i)=>`<rect x="${W-96+i*16}" y="${H-12}" width="11" height="11" rx="2.5" fill="${MOOD_COLORS[s]}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:360px;height:auto" preserveAspectRatio="xMidYMid meet">${months}${rects}<text x="${W-160}" y="${H-3}" font-size="9.5" fill="#9aa0ac">低</text>${legend}<text x="${W-12}" y="${H-3}" font-size="9.5" fill="#9aa0ac">高</text></svg>`;
}

// 睡眠与心境关联洞察：按睡眠分桶对比平均心境评分
function sleepMoodCardHTML(){
  const data=(state.moods||[]).filter(m=>m.sleep!=null&&m.sleep!=='');
  if(data.length<3) return '';
  const buckets=[
    {label:'睡眠差（1-2分）',range:[1,2],color:'var(--red)'},
    {label:'睡眠一般（3分）',range:[3,3],color:'var(--orange)'},
    {label:'睡眠好（4-5分）',range:[4,5],color:'var(--green)'}
  ];
  const stats=buckets.map(b=>{
    const items=data.filter(m=>{const s=Number(m.sleep);return s>=b.range[0]&&s<=b.range[1];});
    const avg=items.length?(items.reduce((s,m)=>s+Number(m.score),0)/items.length):null;
    return {...b,n:items.length,avg};
  }).filter(s=>s.n>0&&s.avg!=null);
  if(stats.length<2) return '';
  const maxAvg=Math.max(...stats.map(s=>Number(s.avg)),1);
  const good=stats.find(s=>s.range[0]===4), bad=stats.find(s=>s.range[0]===1);
  let insight='';
  if(good&&bad){
    const diff=good.avg-bad.avg;
    if(diff>=0.5) insight=`睡得好时，你的心境平均高出 ${diff.toFixed(1)} 分——好好休息真的很值`;
    else if(diff<=-0.5) insight='数据显示你睡得多时心境反而略低，规律作息可能比睡得更久更重要';
    else insight='睡眠对你心境的影响目前不明显，继续记录会出现更清晰的规律';
  }

function streakDays(moods){
  const dates=new Set(moods.map(m=>m.date));
  let streak=0; const d=new Date();
  if(!dates.has(dstr(d))) d.setDate(d.getDate()-1);
  while(dates.has(dstr(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

/* 情绪趋势专用折线：固定 10 分制 + 短日期标签自动抽稀，彻底解决 X 轴文字挤成一团的问题 */
function shortMD(s){
  const p=String(s||'').split('-');
  return p.length>=3?`${Number(p[1])}/${Number(p[2])}`:String(s||'');
}
function moodTrendSVG(data){
  const W=660,H=214,padL=34,padR=16,padT=22,padB=34;
  const iw=W-padL-padR, ih=H-padT-padB, n=data.length;
  const x=i=>padL+(n===1?iw/2:i*iw/(n-1));
  const y=v=>padT+ih-(Math.max(0,Math.min(10,Number(v)||0))/10)*ih;
  let grid='';
  [0,2,4,6,8,10].forEach(v=>{
    const yy=y(v);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#eef0f4" stroke-width="1"/>`;
    grid+=`<text x="${padL-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#9aa0ac">${v}</text>`;
  });
  // 跨月分隔线 + 月份小标
  let monthMarks='', prevYm='';
  data.forEach((m,i)=>{
    const ym=String(m.date||'').slice(0,7);
    if(ym&&ym!==prevYm){
      if(prevYm) monthMarks+=`<line x1="${x(i).toFixed(1)}" y1="${padT}" x2="${x(i).toFixed(1)}" y2="${padT+ih}" stroke="#dfe3f3" stroke-width="1" stroke-dasharray="3 4"/><text x="${(x(i)+4).toFixed(1)}" y="${padT-6}" font-size="10" fill="#9aa0ac">${Number(ym.slice(5))}月</text>`;
      prevYm=ym;
    }
  });
  const vals=data.map(m=>Number(m.score)||0);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`<polygon points="${padL},${y(0).toFixed(1)} ${pts} ${x(n-1).toFixed(1)},${y(0).toFixed(1)}" fill="#4f5ef7" opacity="0.08"/>`;
  const dots=vals.map((v,i)=>{
    const m=data[i], sc=Number(m.score)||0;
    const tip=`${fmtDate(m.date)} · ${sc} 分 · ${MOOD_LABEL[sc]||''}${m.note?' · '+String(m.note).slice(0,24):''}`;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.1" fill="${MOOD_COLORS[sc]||'#9aa0ac'}" stroke="#fff" stroke-width="1.8"><title>${esc(tip)}</title></circle>`;
  }).join('');
  // X 轴最多约 7 个标签，首尾必显示，绝不重叠
  const step=Math.max(1,Math.ceil(n/7)), shown=[];
  for(let i=0;i<n;i+=step) shown.push(i);
  if(shown[shown.length-1]!==n-1){
    if(n-1-shown[shown.length-1]<Math.max(2,Math.floor(step*0.7))) shown[shown.length-1]=n-1;
    else shown.push(n-1);
  }
  const xl=shown.map(i=>`<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#9aa0ac">${esc(shortMD(data[i].date))}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">${grid}${monthMarks}${area}<polyline points="${pts}" fill="none" stroke="#4f5ef7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}
function drawMoodChart(){
  const el=$('#moodChart'); if(!el)return;
  const all=[...state.moods].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const data=moodChartRange>0?all.slice(-moodChartRange):all;
  if(data.length<2){ el.innerHTML='<div class="empty" style="padding:20px">数据太少，再多记几天就能看到趋势</div>'; return; }
  el.innerHTML=moodTrendSVG(data)+`<div class="chart-foot">共 ${data.length} 条 · ${fmtDate(data[0].date)} — ${fmtDate(data[data.length-1].date)} · 悬停圆点看当天详情</div>`;
}

function relInsightHTML(cmp){
  if(!cmp.length) return '';
  const tips=[];
  const late=cmp.map(x=>({...x,days:(()=>{ const l=x.list[0]; if(!l||!l.date) return 999; const a=new Date(l.date+'T00:00:00'),b=new Date(today()+'T00:00:00'); return Math.round((b-a)/86400000); })()}));
  const ignored=late.filter(x=>x.days>=3).sort((a,b)=>b.days-a.days)[0];
  if(ignored) tips.push(`<b>${ignored.t.label}</b>已经 ${ignored.days} 天没记录了，今天主动联系一下吧`);
  if(cmp.length>=2){
    const low=[...cmp].sort((a,b)=>a.avg-b.avg)[0], high=[...cmp].sort((a,b)=>b.avg-a.avg)[0];
    if(low&&high&&high.avg-low.avg>=0.5) tips.push(`最近<b>${high.t.label}</b>状态最好（${high.avg.toFixed(1)}），<b>${low.t.label}</b>偏低（${low.avg.toFixed(1)}），可以多在意的那一头花点心思`);
  }
  const todayCount=relList().filter(r=>r.date===today()).length;
  const typesToday=new Set(); relList().filter(r=>r.date===today()).forEach(r=>(r.types||[]).forEach(t=>typesToday.add(t)));
  if(todayCount) tips.push(`今天已记录 ${todayCount} 条，覆盖 ${typesToday.size} 类关系`);
  if(!tips.length) return '';
  return `<div style="margin-top:10px;font-size:12px;color:var(--text-2);background:var(--gray-soft);border-radius:8px;padding:8px 10px;line-height:1.7">💡 ${tips.join('<br>')}</div>`;
}

/* ===== 笔记阶段数据复盘：每篇笔记固定 次日 / 三日 / 七日 / 三十日 四个节点 =====
   每条数据都是追加式流水（u.checkpoints[]），旧笔记没有该字段也能正常显示；
   记一次更新只追加、不覆盖，因此每一次数据变化都留得下来。 */
const SIDE_STAGES=[
  {key:'d1', label:'次日',   days:1},
  {key:'d3', label:'三日',   days:3},
  {key:'d7', label:'七日',   days:7},
  {key:'d30',label:'三十日', days:30}
];
function sideAddDays(ds,n){
  const d=new Date((ds||'')+'T00:00:00');
  if(isNaN(d)||!ds) return '';
  d.setDate(d.getDate()+n);
  return dstr(d);
}
function stageDue(u,st){ return sideAddDays(u&&u.date,st.days); }
function uCps(u){ return (u&&Array.isArray(u.checkpoints))?u.checkpoints:[]; }
function cpsOf(u,key){
  return uCps(u).filter(c=>c&&c.stage===key)
    .sort((a,b)=>String(a.createdAt||a.date||'').localeCompare(String(b.createdAt||b.date||'')));
}
function latestCp(u,key){ const a=cpsOf(u,key); return a.length?a[a.length-1]:null; }
function cpFilled(u,key){ return cpsOf(u,key).length>0; }
function cpStageCount(u){ return SIDE_STAGES.filter(st=>cpFilled(u,st.key)).length; }
/* 0 起点的增长折线：刻度干净、不会出现负数；W/H 可按需给半宽列缩小画布而不被压扁 */
function growthChartSVG(vals,labels,color,opt){
  opt=opt||{};
  const W=opt.W||640,H=opt.H||190,padL=52,padR=14,padT=14,padB=30;
  const iw=W-padL-padR, ih=H-padT-padB;
  const max=Math.max(1,...vals.map(v=>Number(v)||0));
  const top=opt.top||Math.max(max,Math.ceil(max*1.08/10)*10);
  const ticks=opt.ticks||[0,.25,.5,.75,1];
  const x=i=>padL+(vals.length===1?iw/2:i*(iw/(vals.length-1)));
  const y=v=>padT+ih-(Math.max(0,Number(v)||0)/top)*ih;
  let grid='';
  ticks.forEach(f=>{
    const yy=y(top*f);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#eef0f4" stroke-width="1"/>`;
    grid+=`<text x="${padL-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9aa0ac">${fmtMoney(Math.round(top*f))}</text>`;
  });
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`<polygon points="${padL},${y(0).toFixed(1)} ${pts} ${x(vals.length-1).toFixed(1)},${y(0).toFixed(1)}" fill="${color}" opacity="0.09"/>`;
  const dots=vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4" fill="#fff" stroke="${color}" stroke-width="2"><title>${esc(labels[i]||'')}：${fmtMoney(v)}</title></circle>`).join('');
  const xl=labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#9aa0ac">${esc(l||'')}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">${grid}${area}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}
function sideStageCurveHTML(ups,readUnit,color,opt){
  const vals=SIDE_STAGES.map(st=>{
    const a=ups.map(u=>latestCp(u,st.key)).filter(Boolean).map(c=>Number(c.reads)||0);
    return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  });
  if(!vals.some(v=>v>0)) return `<div class="empty" style="padding:16px"><p>在「数据复盘」里记录次日 / 三日 / 七日 / 三十日的数据后，这里会出现增长曲线</p></div>`;
  return growthChartSVG(vals,SIDE_STAGES.map(x=>x.label),color,opt);
}

function sideCardHTML(s){
    const weekCount=countThisWeek(s.updates);
    const target=s.targetPerWeek||3;
    const pct=Math.min(100,Math.round(weekCount/target*100));
    const isRed=s.platform==='小红书';
    const accent=isRed?'#f43f5e':'#4f5ef7';
    const ups=[...(s.updates||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const total=ups.length;
    const withData=ups.filter(u=>(u.reads||0)>0||(u.likes||0)>0);
    const avgReads=withData.length?Math.round(withData.reduce((x,u)=>x+(u.reads||0),0)/withData.length):null;
    const avgLikes=withData.length?Math.round(withData.reduce((x,u)=>x+(u.likes||0),0)/withData.length):null;
    const sumReads=ups.reduce((x,u)=>x+(u.reads||0),0);
    const sumLikes=ups.reduce((x,u)=>x+(u.likes||0),0);
    const readUnit=isRed?'播放':'阅读';
    const chartData=[...ups].reverse().slice(-10);
    const chartMode=sideChartMode==='likes'?'likes':'reads';
    const hasChart=chartData.some(u=>(u[chartMode]||0)>0);

    const snaps=[...(s.snapshots||[])].sort((a,b)=>(a.month||'').localeCompare(b.month||''));
    const curFollowers=snaps.length?(snaps[snaps.length-1].followers!=null?snaps[snaps.length-1].followers:s.followers):(s.followers||0);
    const trendMode=sideTrendMode;
    const trendLabel=trendMode==='followers'?'粉丝':(trendMode==='reads'?readUnit:'点赞');
    const trendVals=snaps.map(sp=>Number(sp[trendMode])||0);
    const hasTrend=snaps.length>=2 && trendVals.some(v=>v>0);
    const lastGain=snaps.length>=2?((snaps[snaps.length-1].followers||0)-(snaps[snaps.length-2].followers||0)):null;

    /* ① 更新热力图独占整行：26 周本来就很宽，不再塞进半宽列 */
    const heatHTML=`<div class="side-chart side-block">
      <div class="sc-head"><h4>更新热力图</h4><span class="sc-sub">近 26 周 · 更新 ${inRangeCount(ups)} 篇</span></div>
      ${total?`<div style="overflow-x:auto">${updatesHeatmapSVG(ups,accent)}</div><div class="sc-note">颜色越深更新越多 · 悬停格子看当天详情</div>`
             :`<div class="empty" style="padding:18px"><p>记一次更新后，这里会出现你的打卡热力图</p></div>`}
    </div>`;

    /* ② 左列：账号数据趋势（快照明细默认收起，避免把两列拉得高低不齐） */

function barChartSVG(items,opt){
  opt=opt||{};
  const W=opt.W||640,H=opt.H||170,padL=40,padR=12,padT=16,padB=26;
  const iw=W-padL-padR, ih=H-padT-padB;
  const max=Math.max(...items.map(i=>Number(i[opt.key])||0),1);
  const n=items.length, slot=iw/n, bw=Math.min(40,slot*0.62);
  let bars='', labels='';
  items.forEach((it,i)=>{
    const v=Number(it[opt.key])||0;
    const cx=padL+slot*i+slot/2;
    const h=(v/max)*ih;
    const y=padT+ih-h;
    const d=new Date((it.date||'')+'T00:00:00');
    const dl=isNaN(d)?(i+1):`${d.getMonth()+1}/${d.getDate()}`;
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="4" fill="${opt.color}" opacity="0.82"><title>${esc(it.title||'')} ${dl}：${opt.label} ${fmtMoney(v)}</title></rect>`;
    if(v>0) bars+=`<text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#9aa0ac">${fmtMoney(v)}</text>`;
    const step=Math.ceil(n/10);
    if(i%step===0||i===n-1) labels+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#9aa0ac">${dl}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="#e7e9ee" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

/* 统计近 26 周（热力图窗口）内的更新篇数 */
function inRangeCount(updates){
  const end=new Date(); end.setHours(0,0,0,0);
  const start=new Date(end); start.setDate(start.getDate()-(26-1)*7);
  start.setDate(start.getDate()-((start.getDay()+6)%7));
  return (updates||[]).filter(u=>{
    const ds=String(u.date||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return false;
    const d=new Date(ds+'T00:00:00');
    return d>=start&&d<=end;
  }).length;
}

/* 更新热力图：近 26 周按天统计更新次数，GitHub 贡献图风格（周一为每列起点） */
function updatesHeatmapSVG(updates,accent){
  const WEEKS=26, CELL=13, GAP=3, PADL=34, PADT=20, PADR=10, PADB=26;
  const map={};
  (updates||[]).forEach(u=>{
    const ds=String(u.date||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
    const rec=map[ds]||(map[ds]={n:0,titles:[]});
    rec.n++; if(u.title) rec.titles.push(u.title);
  });
  const end=new Date(); end.setHours(0,0,0,0);
  const start=new Date(end); start.setDate(start.getDate()-(WEEKS-1)*7);
  start.setDate(start.getDate()-((start.getDay()+6)%7));   // 回退到周一
  const cells=[], monthMarks=[];
  let prevMonth=-1;
  const inRange=[];
  const cur=new Date(start);
  for(let w=0;w<WEEKS;w++){
    for(let d=0;d<7;d++){
      if(cur>end) break;
      const ds=dstr(cur);
      const rec=map[ds];
      inRange.push({ds,n:rec?rec.n:0,titles:rec?rec.titles:[],col:w,row:d,x:PADL+w*(CELL+GAP),y:PADT+d*(CELL+GAP)});
      cur.setDate(cur.getDate()+1);
    }
    const d0=new Date(start); d0.setDate(d0.getDate()+w*7);
    if(d0<=end && d0.getMonth()!==prevMonth){ monthMarks.push({x:PADL+w*(CELL+GAP),label:(d0.getMonth()+1)+'月'}); prevMonth=d0.getMonth(); }
  }
  let rects='';
  inRange.forEach(c=>{
    const lv=c.n===0?0:Math.min(c.n,4);
    const fill=lv===0?'#e9ebf0':accent;
    const op=lv===0?1:[0,0.28,0.52,0.76,1][lv];
    const title=c.n===0?`${c.ds}：未更新`:`${c.ds}：更新 ${c.n} 篇${c.titles.length?'\n· '+c.titles.map(esc).join('\n· '):''}`;
    rects+=`<rect x="${c.x}" y="${c.y}" width="${CELL}" height="${CELL}" rx="3" fill="${fill}" opacity="${op}" stroke="#ffffff" stroke-width="1"><title>${title}</title></rect>`;
  });
  const rowLabels=[0,2,4,6].map(d=>{
    const names=['一','二','三','四','五','六','日'];
    return `<text x="${PADL-6}" y="${PADT+d*(CELL+GAP)+CELL/2+3.5}" text-anchor="end" font-size="9" fill="#9aa0ac">${names[d]}</text>`;
  }).join('');
  const months=monthMarks.map(m=>`<text x="${m.x}" y="11" font-size="9.5" fill="#9aa0ac">${m.label}</text>`).join('');
  const W=PADL+WEEKS*(CELL+GAP)-GAP+PADR, H=PADT+7*(CELL+GAP)-GAP+PADB;
  const legendY=H-10;
  const legend=`<text x="${W-118}" y="${legendY}" text-anchor="end" font-size="9.5" fill="#9aa0ac">少</text>`+
    [1,2,3,4].map(lv=>`<rect x="${W-110+(lv-1)*15}" y="${legendY-9}" width="10" height="10" rx="2.5" fill="${accent}" opacity="${[0,0.28,0.52,0.76,1][lv]}"></rect>`).join('')+
    `<text x="${W-110+4*15+13}" y="${legendY}" font-size="9.5" fill="#9aa0ac">多</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto" preserveAspectRatio="xMidYMid meet">${months}${rowLabels}${rects}${legend}</svg>`;
}

function countThisWeek(updates){ const mon=weekMonday(); return (updates||[]).filter(u=>new Date(u.date+'T00:00:00')>=mon).length; }
function countRecent(updates,days){ const c=new Date(); c.setDate(c.getDate()-days); return (updates||[]).filter(u=>new Date(u.date+'T00:00:00')>=c).length; }

/* ================= 阅读观影 =================
   数据：state.media = [{ id, cat, title, creator, genre, status, rating, date,

const MEDIA_BUILTIN_CATS=[

   creator:'导演 / 主演', dateLabel:'观看日期', status:['想看','已看','重看'], kinds:['观感','台词','细节','思考','行动','联想'], locLabel:'时间点 / 场景', progress:false},
  {key:'news', label:'新闻思考', short:'新闻', color:'#f59e0b', soft:'#fef3e0', branchLabel:'话题', unit:'条',
   creator:'来源 / 媒体', dateLabel:'阅读日期', status:['待读','已读','持续关注'], kinds:['事实','观点','思考','追问','联想','行动'], locLabel:'出处 / 段落', progress:false},
  {key:'idea', label:'灵感随笔', short:'灵感', color:'#16a34a', soft:'#e8f7ee', branchLabel:'灵感', unit:'条',
   creator:'来源 / 场景', dateLabel:'记录日期', status:['待琢磨','在想','已落地','存档'], kinds:['灵感','思考','行动','联想','疑问'], locLabel:'出处 / 情境', progress:false}
];
const MEDIA_COLOR_PRESETS=[
  {name:'蓝',color:'#2563eb',soft:'#eaf1fe'},{name:'紫',color:'#7c3aed',soft:'#f3edff'},
  {name:'橙',color:'#f59e0b',soft:'#fef3e0'},{name:'绿',color:'#16a34a',soft:'#e8f7ee'},
  {name:'粉',color:'#e11d74',soft:'#fdeaf3'},{name:'红',color:'#dc2626',soft:'#fdecec'}
];
/* 内置四类 + 用户自建分类；被移除的内置分类进 mediaHiddenCats，随时可恢复 */
function mediaHidden(){ return Array.isArray(state.mediaHiddenCats)?state.mediaHiddenCats:[]; }
function mediaAllCats(){
  const extra=Array.isArray(state.mediaCats)?state.mediaCats.filter(c=>c&&c.key&&c.label):[];
  return MEDIA_BUILTIN_CATS.concat(extra);
}
function mediaCats(){ const h=mediaHidden(); return mediaAllCats().filter(c=>!h.includes(c.key)); }
function mediaCatRaw(k){ return mediaAllCats().find(c=>c.key===k)||MEDIA_BUILTIN_CATS[0]; }
/* 旧数据里不存在的 key 一律回退到第一类，绝不丢数据 */
function mediaCat(k){ return mediaCats().find(c=>c.key===k)||MEDIA_BUILTIN_CATS[0]; }
function mediaIsCat(k){ return mediaCats().some(c=>c.key===k); }
function mediaCustomCat(label,color,soft){
  return {key:'custom_'+uid(),label,short:String(label).slice(0,2),color,soft,branchLabel:'条目',unit:'条',
    creator:'来源 / 作者',dateLabel:'记录日期',status:['想记','进行中','已完成','存档'],
    kinds:['记录','思考','行动','联想','疑问','灵感'],locLabel:'出处 / 位置',progress:false,custom:true};
}
function mediaItems(cat){ return (state.media||[]).filter(x=>x&&x.cat===cat).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
function mediaItem(id){ return (state.media||[]).find(x=>x&&x.id===id); }
function mediaEntries(it){ return (it&&Array.isArray(it.entries))?it.entries:[]; }
function mediaAllEntries(){
  const rows=[];
  (state.media||[]).forEach(it=>mediaEntries(it).forEach(en=>rows.push({it,en})));
  return rows.sort((a,b)=>(b.en.date||'').localeCompare(a.en.date||''));
}
function mediaStarsHTML(n){
  n=Number(n)||0;
  return `<span class="mn-stars">${[1,2,3,4,5].map(i=>`<span class="${i<=n?'':'off'}">★</span>`).join('')}</span>`;
}
function mediaStarPicker(it){

  return `<span class="mn-stars" title="点击星星评分">${[1,2,3,4,5].map(i=>`<button data-action="media-star" data-id="${it.id}" data-rating="${i}" title="评为 ${i} 星" style="padding:0 1px;color:${i<=n?'#f59e0b':'#dfe2e8'}">★</button>`).join('')}${n?'<button data-action="media-star" data-id="'+it.id+'" data-rating="0" title="清除评分" style="color:var(--text-3);font-size:11px;margin-left:6px;letter-spacing:0">清除</button>':''}</span>`;

function mediaBadge(it){ const c=mediaCat(it.cat); return `<span class="mn-badge" style="background:${c.soft};color:${c.color}">${esc(it.status||'未标记')}</span>`; }
function mediaPct(it){
  const p=it.progress||{}, total=Number(p.total)||0;
  if(!total) return null;
  return Math.min(100,Math.round((Number(p.cur)||0)/total*100));
}

/* ---- 可视化：近 12 月笔记柱状图 / 分类环形图 ---- */
function mediaMonthSVG(rows){
  const months=[], base=new Date(); base.setDate(1);
  for(let i=11;i>=0;i--){ const x=new Date(base); x.setMonth(x.getMonth()-i); months.push({key:`${x.getFullYear()}-${pad(x.getMonth()+1)}`,label:(x.getMonth()+1)+'月',n:0}); }
  rows.forEach(r=>{ const m=months.find(v=>v.key===String(r.en.date||'').slice(0,7)); if(m) m.n++; });
  const W=560,H=180,padL=32,padR=10,padT=16,padB=28;
  const iw=W-padL-padR, ih=H-padT-padB, max=Math.max(1,...months.map(m=>m.n));
  const slot=iw/months.length, bw=Math.min(30,slot*0.62);
  let grid=`<line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="#e7e9ee"/>`;
  [0.5,1].forEach(f=>{ const yy=padT+ih-f*ih; grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eef0f4"/><text x="${padL-7}" y="${yy+4}" text-anchor="end" font-size="9.5" fill="#9aa0ac">${Math.round(max*f)}</text>`; });
  let bars='';
  months.forEach((m,i)=>{
    const h=(m.n/max)*ih, y=padT+ih-h, cx=padL+slot*i+slot/2;
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="4" fill="#4f5ef7" opacity="0.82"><title>${esc(m.key)}：${m.n} 条笔记</title></rect>`;
    if(m.n) bars+=`<text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#9aa0ac">${m.n}</text>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#9aa0ac">${m.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">${grid}${bars}</svg>`;
}
function mediaDonutSVG(parts,total){
  const R=52,cx=75,cy=75,C=2*Math.PI*R;
  let acc=0,segs='';
  parts.forEach(p=>{
    if(!p.n) return;
    const len=C*p.n/total;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${p.color}" stroke-width="19" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(p.label)}：${p.n} 个条目</title></circle>`;
    acc+=len;
  });
  return `<svg viewBox="0 0 150 150" style="width:100%;height:auto"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f1f2f5" stroke-width="19"/>${segs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="22" font-weight="800" fill="#1b1f2a">${total}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#9aa0ac">个条目</text></svg>`;
}

/* ---- 独立「检索」子栏目：全文 + 笔记类型 + 标签 + 分类，四维交叉 ---- */
function mediaHL(s,q){
  const t=esc(String(s==null?'':s)), k=String(q||'').trim();
  if(!k) return t;
  const safe=esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return t.replace(new RegExp('('+safe+')','ig'),'<mark>$1</mark>'); }catch(e){ return t; }
}
function mediaSnippet(s,q,len){
  const t=String(s||'').replace(/\s+/g,' '), k=String(q||'').trim();
  if(!k||t.length<=len) return t;
  const i=t.toLowerCase().indexOf(k.toLowerCase());
  if(i<0) return t.slice(0,len)+(t.length>len?'…':'');
  const st=Math.max(0,i-22);
  return (st?'…':'')+t.slice(st,st+len)+(st+len<t.length?'…':'');
}
function mediaSearchData(){
  const q=String(mediaQuery||'').trim().toLowerCase();
  const all=state.media||[];
  const catOK=it=>mediaSearchCat==='全部'||it.cat===mediaSearchCat;
  const tag=mediaSearchTag;
  const itemTagOK=it=>tag==='全部'||(it.tags||[]).includes(tag)||mediaEntries(it).some(en=>(en.tags||[]).includes(tag));
  const noteTagOK=r=>tag==='全部'||(r.it.tags||[]).includes(tag)||(r.en.tags||[]).includes(tag);
  const qOK=s=>!q||String(s||'').toLowerCase().includes(q);
  const itemText=it=>[it.title,it.creator,it.genre,it.status,it.summary,(it.tags||[]).join(' ')].join(' ');
  const noteText=(it,en)=>[en.text,en.kind,en.loc,en.mood,(en.tags||[]).join(' '),it.title].join(' ');
  const items=all.filter(it=>catOK(it)&&itemTagOK(it)&&(qOK(itemText(it))||mediaEntries(it).some(en=>qOK(noteText(it,en)))));
  let notes=mediaAllEntries().filter(r=>catOK(r.it)&&noteTagOK(r)&&qOK(noteText(r.it,r.en)));
  if(mediaSearchKind!=='全部') notes=notes.filter(r=>(r.en.kind||'笔记')===mediaSearchKind);
  return {items,notes,q};
}
function mediaSearchResultsHTML(){
  const {items,notes,q}=mediaSearchData();

  if(!items.length&&!notes.length) return sum+`<div class="card empty"><p>没有匹配的内容，换个关键词或点「重置筛选」试试</p></div>`;
  const itemRows=items.length?items.map(it=>{

      <span class="ms-item-n">${mediaEntries(it).length} 条</span></div>`;

function submitMediaCat(e){
  e.preventDefault();
  const f=e.target, label=mediaVal(f,'label').trim();
  if(!label){ toast('请填写分类名称'); return; }
  if(!Array.isArray(state.mediaCats)) state.mediaCats=[];
  if(mediaCats().some(c=>c.label===label)){ toast('已经有同名分类了'); return; }
  const radio=f.querySelector('[name="color"]:checked');
  const p=MEDIA_COLOR_PRESETS[Number(radio?radio.value:0)]||MEDIA_COLOR_PRESETS[0];
  const kinds=mediaVal(f,'kinds').split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  const c=mediaCustomCat(label,p.color,p.soft);
  if(kinds.length) c.kinds=kinds;
  state.mediaCats.push(c);
  mediaSubView=c.key; mediaItemId=null;
  save(); closeModal(); render(); toast('分类已创建，可以往里记内容了');
}

/* ---- 相关图片（可选）：粘贴 / 选文件 → 前端压缩 → 随条目保存 ---- */
const MEDIA_IMG_MAX=8;
let mediaFormImages=[];
function mediaFormImagesHTML(){
  return mediaFormImages.length
    ? `<div class="mn-img-grid">${mediaFormImages.map((im,i)=>`<div class="mn-img-thumb"><img src="${esc(im.data)}" alt="${esc(im.name||'图片')}"><button type="button" data-action="media-img-del" data-idx="${i}" title="移除这张">×</button></div>`).join('')}</div>`
    : `<div class="mn-img-empty">还没有图片。可以 Ctrl+V 直接粘贴，或点上面的按钮选择。</div>`;
}
function mediaRenderFormImages(){
  const box=document.getElementById('mnImgPreview');
  if(box) box.innerHTML=mediaFormImagesHTML();
}
function mediaCompressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//.test(file.type||'')){ reject(new Error('不是图片')); return; }
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('文件读取失败'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('图片读取失败'));
      img.onload=()=>{
        const MAX=960;
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h){ reject(new Error('图片尺寸异常')); return; }
        const scale=Math.min(1,MAX/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d');
        if(!ctx){ reject(new Error('当前环境不支持图片压缩')); return; }
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        let out;
        try{ out=cv.toDataURL('image/jpeg',0.72); }catch(e){ resolve(String(fr.result)); return; }
        if(out.length>260000){ try{ out=cv.toDataURL('image/jpeg',0.55); }catch(e){} }
        resolve(out);
      };
      img.src=String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}
async function mediaAddImages(files){
  const arr=Array.from(files||[]).filter(f=>f&&/^image\//.test(f.type||''));
  if(!arr.length){ toast('请选择图片，或复制一张图片后按 Ctrl+V'); return; }
  let added=0;
  for(const f of arr){
    if(mediaFormImages.length>=MEDIA_IMG_MAX) break;
    try{
      const data=await mediaCompressImage(f);
      mediaFormImages.push({ id:uid(), data, name:f.name||'粘贴的图片', createdAt:today() });
      added++;
    }catch(e){ /* 单张失败不影响其它图片 */ }
  }
  mediaRenderFormImages();
  toast(added?'已添加 '+added+' 张图，保存后生效':'图片没能读取成功，换一张试试');
}
/* 只在「条目表单」打开时接管粘贴图片，其它输入框粘贴文字不受影响 */
document.addEventListener('paste',e=>{
  if(!document.getElementById('mnImgPreview')||!e.clipboardData) return;
  const items=Array.from(e.clipboardData.items||[]).filter(it=>it&&String(it.type||'').indexOf('image/')===0);
  if(!items.length) return;
  e.preventDefault();
  mediaAddImages(items.map(it=>it.getAsFile()).filter(Boolean));
});

/* ---- 导出本栏目为 Markdown（不影响其他数据） ---- */
function mediaExport(){
  const items=state.media||[];
  if(!items.length){ toast('还没有内容可导出'); return; }
  let md='# 阅读观影笔记\n\n导出时间：'+today()+'\n';
  mediaCats().forEach(c=>{
    const list=mediaItems(c.key); if(!list.length) return;
    md+='\n## '+c.label+'（'+list.length+' '+c.unit+'）\n';
    list.forEach(it=>{
      md+='\n### '+(it.title||'未命名')+'\n\n';
      md+='- '+c.creator+'：'+(it.creator||'—')+'\n- 状态：'+(it.status||'—')+'\n- '+c.dateLabel+'：'+(it.date||'—')+'\n- 评分：'+(Number(it.rating)||0)+'/5\n';
      if(it.finishDate) md+='- 完成日期：'+it.finishDate+'\n';
      if(it.genre) md+='- 类型：'+it.genre+'\n';
      if((it.tags||[]).length) md+='- 标签：'+it.tags.join('、')+'\n';
      if((it.images||[]).length) md+='- 相关图片：'+it.images.length+' 张（保存在工作台里）\n';
      if(c.progress&&it.progress&&Number(it.progress.total)>0) md+='- 阅读进度：'+(it.progress.cur||0)+'/'+it.progress.total+' 页\n';
      if(it.summary) md+='\n> '+it.summary+'\n';
      const ens=mediaEntries(it).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      if(ens.length){
        md+='\n**笔记（'+ens.length+' 条）**\n';
        ens.forEach(en=>{ md+='\n- '+(en.date||'—')+' · '+(en.kind||'笔记')+(en.loc?' · '+en.loc:'')+((en.tags||[]).length?' · #'+en.tags.join(' #'):'')+'\n  '+String(en.text||'').replace(/\n/g,'\n  ')+(en.mood?'\n  （当时：'+en.mood+'）':'')+'\n'; });
      }
    });
  });
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='阅读观影笔记-'+today()+'.md'; a.click(); URL.revokeObjectURL(a.href);
  toast('笔记已导出为 Markdown');

/* ---- 储蓄小荷包：自动按日累积 / 一个月记一次余额 ---- */
function goalEntries(g){ return (Array.isArray(g&&g.entries)?g.entries:[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))); }
function goalBaseDate(g,asOf){
  asOf=asOf||today();
  let d=String(g.startDate||'').slice(0,10)||String(g.createdAt||'').slice(0,10)||today();
  goalEntries(g).forEach(x=>{ const ed=String(x.date||'').slice(0,10); if(x.type==='set'&&ed&&ed<=asOf) d=ed; });
  return d;
}
/* 自动累积期数：从基准日的「次日」算到目标日（基准日金额已含在余额里，不重复计） */
function autoPeriods(g,from,to){
  if(!(Number(g.periodicAmount)>0)) return 0;
  const a=new Date(from+'T00:00:00'), b=new Date(to+'T00:00:00');
  if(isNaN(a.getTime())||isNaN(b.getTime())||b<=a) return 0;
  const days=Math.floor((b-a)/86400000);
  const p=g.period||'daily';
  if(p==='daily') return days;
  if(p==='weekly') return Math.floor(days/7);
  const anchor=Math.min(28,Math.max(1,Number(g.monthDay)||1));
  let c=0;
  for(let i=0;i<240;i++){
    const d=new Date(a.getFullYear(),a.getMonth()+i,anchor);
    if(d>b) break;
    if(d>a) c++;
  }
  return c;
}
function goalBalanceOn(g,asOf){
  asOf=asOf||today();
  let base=Number(g.startBalance)||0;
  let baseDate=String(g.startDate||'').slice(0,10)||String(g.createdAt||'').slice(0,10)||today();
  goalEntries(g).forEach(x=>{
    const d=String(x.date||'').slice(0,10);
    if(!d||d>asOf) return;
    const v=Number(x.amount)||0;
    if(x.type==='set'){ base=v; baseDate=d; }
    else if(x.type==='withdraw'){ base-=Math.abs(v); }
    else base+=v;
  });
  if(g.mode==='auto') base+=autoPeriods(g,baseDate,asOf)*(Number(g.periodicAmount)||0);
  return Math.max(0,Math.round(base*100)/100);
}
function goalMonthSeries(g,count){
  count=count||6; const labels=[],vals=[],now=new Date();
  for(let i=count-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i+1,0);
    const ds=dstr(d)>today()?today():dstr(d);
    labels.push((d.getMonth()+1)+'月');
    vals.push(goalBalanceOn(g,ds));
  }
  return {labels,vals};
}
function goalSparkHTML(g){
  const s=goalMonthSeries(g,6);
  if(!s.vals.some(v=>v>0)) return '';

function goalETAText(g,bal){
  const tar=Number(g.target)||0;
  if(tar<=0) return '未设目标金额 · 纯累积模式，看着它慢慢长大';
  if(bal>=tar) return '🎉 已达成目标，可以开新一个小荷包了';
  const need=tar-bal;
  let rate=0;
  if(g.mode==='auto'&&Number(g.periodicAmount)>0){
    const p=g.period||'daily';
    rate=Number(g.periodicAmount)/(p==='daily'?1:p==='weekly'?7:30);
  }else{
    const s=goalMonthSeries(g,4);
    rate=(s.vals[s.vals.length-1]-s.vals[0])/90;
  }
  if(rate>0.01){
    const days=Math.ceil(need/rate), d=new Date(); d.setDate(d.getDate()+days);
    return `按当前节奏约 ${days} 天后（${fmtDate(dstr(d))}）达成 · 还差 ${fmtYuan(need)}`;
  }
  return `还差 ${fmtYuan(need)} · 设个每日存入金额就能自动推算达成日`;
}

/* ================= 时间记录 ================= */
const TIMER_EMOJIS=['🎂','🎁','🎓','💼','📚','🏠','❤','🎉','🎯','⏰','🌟','🌙','🚀','💪','🌱','🍰','💍','🎈','📅','⭐'];
const TIMER_CATS=['家人','朋友','工作','学业','人生','节日','纪念日','其他'];

/* ---- 农历（阴历）转换 ---- */
const LUNAR_MONTH_NUM={'正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12,'冬':11,'腊':12};
const LUNAR_MONTH_NAMES=['','正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
const LUNAR_DAY_NAMES=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
let _lunarFmt=null;
function lunarFmt(){ if(!_lunarFmt){ try{ _lunarFmt=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{month:'long',day:'numeric'}); }catch(e){ _lunarFmt=null; } } return _lunarFmt; }
function solarToLunar(date){
  const fmt=lunarFmt();
  if(!fmt) return null;
  let month=null, day=null, isLeap=false;
  try{
    const parts=fmt.formatToParts(date);
    for(const p of parts){
      if(p.type==='month'){ let v=p.value; if(v.startsWith('闰')){ isLeap=true; v=v.slice(1); } v=v.replace(/月$/,''); month=LUNAR_MONTH_NUM[v]||LUNAR_MONTH_NUM[v[0]]||1; }
      else if(p.type==='day'){ day=parseInt(p.value,10); }
    }
  }catch(e){ return null; }
  if(month==null||day==null) return null;
  return {month,day,isLeap};
}
function nextLunarOccurrence(lm,ld,leap){
  const today=new Date(); today.setHours(0,0,0,0);
  for(let i=1;i<=400;i++){
    const d=new Date(today.getTime()+i*86400000);
    const lu=solarToLunar(d);
    if(lu && lu.month===lm && lu.day===ld && lu.isLeap===!!leap) return d;
  }
  // 闰月生日、当年无闰月时回退到平月
  if(leap){
    for(let i=1;i<=400;i++){
      const d=new Date(today.getTime()+i*86400000);
      const lu=solarToLunar(d);
      if(lu && lu.month===lm && lu.day===ld && !lu.isLeap) return d;
    }
  }
  return null;
}
function lunarMonthName(m){ return LUNAR_MONTH_NAMES[m]||(m+'月'); }
function lunarDayName(d){ return LUNAR_DAY_NAMES[d]||(d+''); }
function lunarLabel(t){ return (t.lunarLeap?'闰':'')+lunarMonthName(t.lunarMonth)+lunarDayName(t.lunarDay); }

function timerDays(t){
  const today=new Date(); today.setHours(0,0,0,0);
  if(t.type==='countdown'){
    let target;
    if(t.calendar==='lunar'){
      target=nextLunarOccurrence(t.lunarMonth,t.lunarDay,t.lunarLeap);
    }else if(t.repeat){
      target=nextOccurrence(t.date);
    }else{
      target=new Date(t.date+'T00:00:00');
    }
    if(!target) return 0;
    return Math.round((target-today)/86400000);
  }else{
    const start=new Date(t.date+'T00:00:00');
    return Math.round((today-start)/86400000);
  }
}
function nextOccurrence(dateStr){
  const p=dateStr.split('-').map(Number);
  const today=new Date(); today.setHours(0,0,0,0);
  let target=new Date(today.getFullYear(),p[1]-1,p[2]);
  if(target<today) target=new Date(today.getFullYear()+1,p[1]-1,p[2]);
  return target;
}
function daysToYears(days){
  if(days<365) return '';
  const y=Math.floor(days/365.25), rem=Math.floor(days-y*365.25);
  return `≈ ${y} 年${rem?` ${rem} 天`:''}`;
}

function renderTimers(){
  const cats=[...new Set(state.timers.map(t=>t.category).filter(Boolean))];
  let list=state.timers.filter(t=>(timerTypeFilter==='全部'||t.type===timerTypeFilter)&&(timerCatFilter==='全部'||(t.category||'其他')===timerCatFilter));
  list=list.map(t=>({t,d:timerDays(t)})).sort((a,b)=>{
    if(a.t.type!==b.t.type) return a.t.type==='countdown'?-1:1;
    return a.t.type==='countdown'?a.d-b.d:b.d-a.d;
  }).map(x=>x.t);

  const typeFilters=`<div class="filter-bar">${['全部','倒计时','正计时'].map(f=>{const v=f==='全部'?'全部':(f==='倒计时'?'countdown':'countup');return `<button class="chip ${timerTypeFilter===v?'active':''}" data-action="filter-timer-type" data-filter="${v}">${f}</button>`;}).join('')}</div>`;
  const catFilters=`<div class="filter-bar">${['全部',...cats].map(c=>`<button class="chip ${timerCatFilter===c?'active':''}" data-action="filter-timer-cat" data-filter="${c}">${c}</button>`).join('')}</div>`;

  if(!state.timers.length) return emptyBox('timer','还没有时间记录','记录一个重要的日子，倒计时或正计时','add-timer');
  if(!list.length) return typeFilters+catFilters+`<div class="card empty"><p>当前筛选下没有记录</p></div>`;

  const cards=list.map(t=>{
    const d=timerDays(t);
    const isCD=t.type==='countdown';
    const urgent=isCD&&d>=0&&d<=7;
    let num, suffix;
    if(isCD&&d<0){ num='已到期'; suffix=''; }
    else{ num=d.toLocaleString(); suffix='天'; }
    let dateStr;
    if(isCD){
      if(t.calendar==='lunar'){ dateStr=`农历 ${lunarLabel(t)}`; }
      else if(t.repeat){ const nx=nextOccurrence(t.date); dateStr=`每年 ${nx.getMonth()+1}月${nx.getDate()}日`; }
      else{ dateStr=`目标 ${t.date}`; }
    }
    else{ dateStr=`始于 ${t.date}`; }
    const yrs=!isCD?daysToYears(d):'';
    return `<div class="card timer-card">
      <div class="t-top">
        <div class="t-emoji">${t.emoji||'⏰'}</div>
        <div class="t-title">
          <div class="t-name">${esc(t.name)}</div>
          <span class="t-type" style="background:${isCD?'var(--blue-soft)':'var(--green-soft)'};color:${isCD?'var(--blue)':'var(--green)'}">${isCD?'倒计时':'正计时'}${t.calendar==='lunar'?' · 农历':(t.repeat?' · 每年':'')}</span>
        </div>
      </div>
      <div class="t-days" style="color:${urgent?'var(--red)':'var(--text)'}">${num}<span class="t-unit">${suffix}</span></div>
      <div class="t-date">${dateStr}${yrs?` · ${yrs}`:''}</div>
      ${t.note?`<div class="t-note">${esc(t.note)}</div>`:''}
      <div class="t-foot">
        <span class="t-cat">${esc(t.category||'其他')}</span>
        <span class="t-ops">
          <button class="btn-icon" data-action="timer-edit" data-id="${t.id}" title="编辑"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg></button>
          <button class="btn-icon" data-action="timer-del" data-id="${t.id}" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>
        </span>
      </div>
    </div>`;
  }).join('');
  return typeFilters+catFilters+upcomingTimersHTML()+`<div class="timer-grid">${cards}</div>`;
}

// 未来 30 天的重要日子时间轴：聚焦即将到来的倒计时，按临近程度排序
function timerTargetDate(t){
  if(t.calendar==='lunar') return nextLunarOccurrence(t.lunarMonth,t.lunarDay,t.lunarLeap);
  if(t.repeat) return nextOccurrence(t.date);
  return new Date(t.date+'T00:00:00');
}
function upcomingTimersHTML(){
  const list=(state.timers||[])
    .filter(t=>t.type==='countdown')
    .map(t=>{ const target=timerTargetDate(t); return target?{t,left:timerDays(t),target}:null; })
    .filter(x=>x&&x.left>=0&&x.left<=30)
    .sort((a,b)=>a.left-b.left);
  if(!list.length) return '';
  const items=list.map(x=>{
    const t=x.t, left=x.left;
    const badge=left===0
      ?'<span class="up-badge" style="background:var(--red);color:#fff">今天</span>'
      :`<span class="up-badge" style="background:${left<=7?'var(--red-soft)':'var(--orange-soft)'};color:${left<=7?'var(--red)':'var(--orange)'}">${left} 天后</span>`;
    const dateStr=t.calendar==='lunar'?`农历 ${lunarLabel(t)}`:`${fmtDate(dstr(x.target))}${t.repeat?' · 每年':''}`;
    return `<div class="up-item">
      <span class="up-emoji">${t.emoji||'⏰'}</span>
      <div class="up-main"><div class="up-name">${esc(t.name)}</div><div class="up-date">${dateStr}</div></div>
      ${badge}
    </div>`;
  }).join('');
  return `<div class="card" style="padding:16px;margin-bottom:14px">
    <h3 style="font-size:14px;font-weight:700;margin-bottom:10px">未来 30 天的重要日子</h3>
    ${items}
  </div>`;
}

/* ================= 每日时间轴 ================= */
// 数据结构：{ id, date, time('HH:MM'), title, note, done, createdAt }
// 解析快速输入："09:00 写作业" / "9点 开会" / "9点30 健身" → {time,title}
function fmtDuration(min){
  min=Math.round(Number(min)||0);
  if(min<=0) return '';
  if(min<60) return min+' 分';
  const h=Math.floor(min/60), m=min%60;
  return m?`${h} 小时 ${m} 分`:`${h} 小时`;
}
/* 时间轴任务分类（左侧色条 + 徽标） */
const SCHED_CATS=[
  {key:'work',label:'工作',color:'#4f5ef7',soft:'#eef0ff'},
  {key:'study',label:'学习',color:'#2563eb',soft:'#eaf1fe'},
  {key:'life',label:'生活',color:'#16a34a',soft:'#e8f7ee'},
  {key:'health',label:'运动',color:'#f59e0b',soft:'#fef3e0'},
  {key:'other',label:'其他',color:'#9aa0ac',soft:'#f1f2f5'}
];
function schedCat(k){ return SCHED_CATS.find(c=>c.key===k)||SCHED_CATS[SCHED_CATS.length-1]; }
// 一天按时间段分组
function schedSegOf(time){
  const h=parseInt(String(time||'').slice(0,2),10);
  if(isNaN(h)) return 'anytime';
  if(h<12) return 'morning';
  if(h<18) return 'afternoon';
  return 'evening';
}
const SCHED_SEGS=[
  {key:'morning',label:'上午',icon:'🌅'},
  {key:'afternoon',label:'下午',icon:'☀️'},
  {key:'evening',label:'晚上',icon:'🌙'},
  {key:'anytime',label:'未定时',icon:'🕒'}
];
function schedToMin(time){
  const m=String(time||'').match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  return parseInt(m[1],10)*60+parseInt(m[2],10);
}
/* 快速输入语法：
   「09:00 写作业」「9点 开会」「9点30 健身」
   「09:00-10:30 写作业」「9点-11点 看书」→ 自动算出有效时长
   末尾「#学习」可指定分类 */
function parseSchedQuick(text){
  const s=(text||'').trim();
  if(!s) return null;
  const T='(\\d{1,2})\\s*[:：点时]\\s*(\\d{0,2})?';
  const range=s.match(new RegExp('^'+T+'\\s*[-–—~至到]\\s*'+T+'\\s*(.*)$'));
  if(range){
    const h1=parseInt(range[1],10), m1=range[2]?parseInt(range[2],10):0;
    const h2=parseInt(range[3],10), m2=range[4]?parseInt(range[4],10):0;
    if(h1>=0&&h1<=24&&h2>=0&&h2<=24&&m1<60&&m2<60){
      const st=h1*60+m1, en=h2*60+m2;
      return { time:`${pad(h1)}:${pad(m1)}`, duration:en>st?en-st:0, title:(range[5]||'').trim() };
    }
  }
  const one=s.match(new RegExp('^'+T+'\\s*(.*)$'));
  if(one){
    const h=parseInt(one[1],10), mm=one[2]?parseInt(one[2],10):0;
    if(h>=0&&h<=24&&mm<60) return { time:`${pad(h)}:${pad(mm)}`, duration:0, title:(one[3]||'').trim() };
  }
  return { time:'', duration:0, title:s };
}
function schedShift(ds,delta){
  const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+delta); return dstr(d);
}
function schedDayLabel(ds){
  const t=today();
  if(ds===t) return '今天';
  if(ds===schedShift(t,-1)) return '昨天';
  if(ds===schedShift(t,1)) return '明天';
  const d=new Date(ds+'T00:00:00'); return `${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
}

  // 快速输入（分类可记住）+ 一键模板
  const quick=`<form class="sched-quick" onsubmit="quickAddSched(event)">
    <input class="input" id="schedQuick" placeholder="如「09:00 写作业」「9:00-10:30 看书 #学习」回车即加" autocomplete="off">

    <button class="btn btn-primary" type="submit" style="flex:0 0 auto">添加</button>
  </form>
  <div class="sched-presets"><span>快速开始：</span>
    <button class="chip" data-action="sched-template" data-key="study">📚 学习日</button>

  // 概览（一行紧凑）
  const stats=`<div class="sched-pills">
    <div class="stat-pill"><b>${list.length}</b><span>当天任务</span></div>

  // 时间轴（按时间段分组 + 空闲间隔 + 「现在」标记 + 分类色条）
  const isToday=schedDate===today();
  const nowMin=(()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); })();
  const tl=list.length?`<div class="card" style="padding:16px">`+SCHED_SEGS.map(seg=>{

        const pmEnd=pm!=null?pm+(Number(prev.duration)||0):null;

        }
      }
      // 今天：在第一个尚未到达的任务前插入「现在」标记
      if(isToday&&m!=null&&m>nowMin&&!(prev&&schedToMin(prev.time)!=null&&schedToMin(prev.time)>nowMin)){

      }
      const overdue=isToday&&!s.done&&m!=null&&m<nowMin;
      html+=`<div class="tl-item ${s.done?'done':''}" id="tl-${esc(s.id)}">
        <div class="tl-time">${esc(s.time||'—')}</div>

    });
    return html;
  }).join('')+`</div>`:`<div class="card empty"><div class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path d="M12 6v6l4 2"/></svg></div><h3>这一天还没规划</h3><p>用上面的快速输入框添加第一个任务，或点「复制前一天」直接搬过来改</p></div>`;
  // 复盘：24 小时地图 + 分类占比 + 时长分布 + 近 7 天双图 + 自动洞察
  const dayBar=schedDayBarHTML(list,isToday);
  const catBar=schedCatBarHTML(list);
  const dist=schedDurationDist(list);
  const review=schedWeekReview();
  const weekDur=schedWeekDur();
  const rvParts=[];
  if(catBar) rvParts.push(`<div class="rv-block"><div class="rv-t">当日时间都花在哪儿了</div>${catBar}</div>`);
  if(dist) rvParts.push(`<div class="rv-block"><div class="rv-t">各任务有效时长</div>${dist}</div>`);
  if(review||weekDur) rvParts.push(`<div class="rv-block"><div class="rv-t">近 7 天 · 完成率 / 有效时长</div><div class="sched-review">${review}${weekDur}</div></div>`);
  const reviewBox=`<div class="card" style="padding:16px;margin-bottom:14px">
      <div class="chart-head"><h3>复盘</h3><span class="wb-mini">自动汇总，不用额外记录</span></div>
      ${rvParts.length?rvParts.join(''):'<div class="wb-mini">给任务记一次时长，这里就会出现分布图。</div>'}
      ${schedInsightHTML(list)}

  // 当日备忘录：快速待办清单 + 自由随记
  const memoVal=(state.scheduleMemo&&state.scheduleMemo[schedDate])||'';
  const memoList=(state.memos||[]).filter(m=>m.date===schedDate);
  const memoDone=memoList.filter(m=>m.done).length;
  const memoItems=memoList.length?memoList.map(m=>`
      <div class="todo-item ${m.done?'done':''}">
        <button class="todo-check" data-action="memo-toggle" data-id="${m.id}" title="${m.done?'取消完成':'标记完成'}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>

  const memoBox=`<div class="card sched-memo" style="padding:16px">

      <div class="sched-memo-list">${memoItems}</div>
      <div class="sched-memo-free">

  return nav+guide+quick+stats+dayBar+tl+reviewBox+memoBox;
}
// 每日时间轴 · 备忘录：快速添加一条待办（归档到当前查看的日期）
function quickAddMemo(e){
  e.preventDefault();
  const el=$('#memoQuick');
  if(!el) return;
  const text=el.value.trim();
  if(!text){ toast('先写点内容'); el.focus(); return; }
  state.memos=state.memos||[];
  state.memos.push({ id:uid(), date:schedDate, text, done:false, createdAt:new Date().toISOString() });
  save(); render();
  toast('已加入备忘');
  setTimeout(()=>{ const i=$('#memoQuick'); if(i) i.focus(); },0);
}
// 每日时间轴 · 当日备忘录：按日期自由记录，输入即保存（不触发整页重渲染，避免输入框失焦）
let schedMemoSavedTimer=null;
function onSchedMemoInput(el){
  if(!state.scheduleMemo) state.scheduleMemo={};
  state.scheduleMemo[schedDate]=el.value;
  save();
  const s=$('#schedMemoSaved');
  if(s){ const d=new Date(); s.textContent='已保存 '+pad(d.getHours())+':'+pad(d.getMinutes()); s.classList.add('show'); clearTimeout(schedMemoSavedTimer); schedMemoSavedTimer=setTimeout(()=>s.classList.remove('show'),1600); }
}
// 当日有效时长分布（横向条形图）
function schedDurationDist(list){
  const items=list.filter(s=>schedMinutes(s)>0);
  if(!items.length) return '';
  const max=Math.max(...items.map(s=>schedMinutes(s)));
  const rows=items.sort((a,b)=>schedMinutes(b)-schedMinutes(a)).map(s=>{
    const d=schedMinutes(s);

    return `<div class="dur-row"><span class="dur-name">${esc(s.title)}</span><div class="dur-bar"><i style="width:${pct}%"></i></div><span class="dur-val">${fmtDuration(d)}</span></div>`;
  }).join('');
  return rows;
}

function schedWeekDur(){

function schedDayBarHTML(list,isToday){
  const timed=list.filter(s=>schedToMin(s.time)!=null).sort((a,b)=>schedToMin(a.time)-schedToMin(b.time));
  const untimed=list.length-timed.length;

  const laneEnds=[];
  const blocks=timed.map(s=>{
    const st=schedToMin(s.time), mins=schedMinutes(s);
    const en=Math.min(1440,st+(mins>0?mins:30));
    let lane=laneEnds.findIndex(e=>e<=st);
    if(lane<0){ lane=laneEnds.length; laneEnds.push(en); } else laneEnds[lane]=en;
    return {s,st,en,lane,estimated:mins===0};
  });
  const h=Math.min(4,Math.max(1,laneEnds.length))*22+8;
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const html=blocks.map(b=>{
    const cat=schedCat(b.s.cat);
    const left=(b.st/1440*100).toFixed(2), width=Math.max(0.9,(b.en-b.st)/1440*100).toFixed(2);
    const label=Number(width)>7?esc(b.s.title):'';

  }).join('');
  const nowLine=isToday?`<div class="sdb-now" style="left:${(nowMin/1440*100).toFixed(2)}%" title="现在 ${pad(Math.floor(nowMin/60))}:${pad(nowMin%60)}"></div>`:'';

}
function schedCatBarHTML(list){

function schedInsightHTML(list){
  if(!list.length) return `<div class="wb-insight">💡 这一天还没有任务。随手加一条，完成率、时长分布和近 7 天走势就会自动出现。</div>`;
  const done=list.filter(s=>s.done).length, rate=Math.round(done/list.length*100);
  const total=list.reduce((s,x)=>s+schedMinutes(x),0);
  const pomo=list.reduce((s,x)=>s+(Number(x.pomoMinutes)||0),0);
  const segs=SCHED_SEGS.filter(x=>x.key!=='anytime').map(seg=>{
    const it=list.filter(s=>schedSegOf(s.time)===seg.key);
    return {label:seg.label,n:it.length,done:it.filter(s=>s.done).length,rate:it.length?Math.round(it.filter(s=>s.done).length/it.length*100):0};
  }).filter(x=>x.n);
  const best=segs.slice().sort((a,b)=>b.rate-a.rate)[0];
  let all=0,fin=0;
  for(let i=6;i>=0;i--){
    const it=(state.schedule||[]).filter(s=>s.date===schedShift(today(),-i));
    all+=it.length; fin+=it.filter(s=>s.done).length;
  }
  const parts=[`这一天 ${list.length} 条任务完成 ${done} 条（${rate}%），有效时长 ${total?fmtDuration(total):'还没记录'}${pomo?`，其中番茄钟自动回流 ${fmtDuration(pomo)}`:''}。`];
  if(best) parts.push(`${best.label}表现最好：${best.done}/${best.n} 完成（${best.rate}%）。`);
  if(all) parts.push(`近 7 天平均完成率 ${Math.round(fin/all*100)}%（共 ${all} 条）。`);
  if(!total) parts.push('点任务上的「记时长」或用 ▶ 开个番茄钟，分类占比图就有了。');
  return `<div class="wb-insight">💡 ${parts.join(' ')}</div>`;
}

/* 近 12 月新增趋势 */
function whMonthSVG(all){
  const months=[], base=new Date(); base.setDate(1);
  for(let i=11;i>=0;i--){ const x=new Date(base); x.setMonth(x.getMonth()-i); months.push({key:`${x.getFullYear()}-${pad(x.getMonth()+1)}`,label:(x.getMonth()+1)+'月',n:0}); }
  all.forEach(w=>{ const m=months.find(v=>v.key===whDate(w).slice(0,7)); if(m) m.n++; });
  const W=560,H=180,padL=32,padR=10,padT=16,padB=28;
  const iw=W-padL-padR, ih=H-padT-padB, max=Math.max(1,...months.map(m=>m.n));
  const slot=iw/months.length, bw=Math.min(30,slot*0.62);
  let grid=`<line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="#e7e9ee"/>`;
  [0.5,1].forEach(f=>{ const yy=padT+ih-f*ih; grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eef0f4"/><text x="${padL-7}" y="${yy+4}" text-anchor="end" font-size="9.5" fill="#9aa0ac">${Math.round(max*f)}</text>`; });
  let bars='';
  months.forEach((m,i)=>{
    const h=(m.n/max)*ih, y=padT+ih-h, cx=padL+slot*i+slot/2;
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="4" fill="#4f5ef7" opacity="0.82"><title>${esc(m.key)}：${m.n} 条</title></rect>`;
    if(m.n) bars+=`<text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#9aa0ac">${m.n}</text>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#9aa0ac">${m.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">${grid}${bars}</svg>`;
}

function sopReviewBadge(nextReview){
  if(!nextReview) return `<span class="t-cat" style="background:var(--gray-soft);color:var(--text-3)">未设更新</span>`;
  const d=new Date(nextReview+'T00:00:00'), t=new Date(today()+'T00:00:00');
  const diff=Math.round((d-t)/86400000);
  if(diff<0) return `<span class="t-cat" style="background:#fdecec;color:#ef4444">逾期 ${Math.abs(diff)} 天</span>`;
  if(diff===0) return `<span class="t-cat" style="background:#fff3e0;color:#f59e0b">今天该更新</span>`;
  if(diff<=7) return `<span class="t-cat" style="background:#eaf1fe;color:#2563eb">${diff} 天后更新</span>`;
  return `<span class="t-cat" style="background:var(--gray-soft);color:var(--text-3)">${diff} 天后更新</span>`;
}

  list.sort((a,b)=>{
    if((a.fav?0:1)!==(b.fav?0:1)) return (a.fav?0:1)-(b.fav?0:1);

}

/* ================= SVG 折线图 ================= */
function lineChartSVG(series,labels,opt){
  opt=opt||{};
  const W=640,H=opt.compact?180:240,padL=46,padR=14,padT=14,padB=30;
  const iw=W-padL-padR, ih=H-padT-padB;
  let all=series.flatMap(s=>s.data);
  let min=opt.min!=null?opt.min:Math.min(...all);
  let max=opt.max!=null?opt.max:Math.max(...all);
  if(min===max){ min-=1; max+=1; }
  if(min>0&&opt.min==null){ min=0; }
  const padv=(max-min)*0.08; min-=padv; max+=padv;
  const x=i=>padL+(labels.length===1?iw/2:i*(iw/(labels.length-1)));
  const y=v=>padT+ih-(v-min)/(max-min)*ih;

  let grid='';
  for(let i=0;i<=5;i++){
    const v=min+(max-min)*i/5, yy=padT+ih-(v-min)/(max-min)*ih;
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eef0f4" stroke-width="1"/>`;
    grid+=`<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#9aa0ac">${opt.step?(opt.min+i*opt.step):fmtMoney(v)}</text>`;
  }
  let paths='';
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    paths+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.data.forEach((v,i)=>{
      paths+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} ${labels[i]}：${opt.step?v:fmtMoney(v)}</title></circle>`;
    });
  });
  let xlabels='';
  labels.forEach((l,i)=>{
    const step=Math.ceil(labels.length/8);
    if(i%step===0||i===labels.length-1) xlabels+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#9aa0ac">${l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">${grid}${paths}${xlabels}</svg>`;
}

function creditPomoToSchedule(mins){

  s.pomoMinutes=(Number(s.pomoMinutes)||0)+(Number(mins)||0);  // 新增字段，绝不覆盖手记时长

function pomoPeriodRecords(){
  const list=state.pomodoros||[];
  if(pomoPeriod==='week'){ const mon=weekMonday(); return list.filter(p=>new Date(p.date+'T00:00:00')>=mon); }
  if(pomoPeriod==='month') return list.filter(p=>String(p.date||'').startsWith(thisMonth()));
  const from=schedShift(today(),-6);

}

function pomoHourDistHTML(){

const POMO_R=92, POMO_C=2*Math.PI*POMO_R;
function pomoRingHTML(pct,color){
  const off=POMO_C*(1-Math.max(0,Math.min(100,Number(pct)||0))/100);
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="${POMO_R}" fill="none" stroke="var(--gray-soft)" stroke-width="10"/>
    <circle id="pomoRingFill" cx="100" cy="100" r="${POMO_R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${POMO_C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 100 100)"/>
  </svg>`;
}
function pomoStats(period){
  const list=state.pomodoros||[];
  const labels=[], values=[];
  if(period==='week'){
    const now=new Date();
    for(let i=7;i>=0;i--){
      const mon=new Date(now); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)-i*7); mon.setHours(0,0,0,0);
      const sun=new Date(mon); sun.setDate(sun.getDate()+6); sun.setHours(23,59,59,999);
      const mins=list.filter(p=>{ const t=new Date(p.date+'T00:00:00'); return t>=mon&&t<=sun; }).reduce((s,p)=>s+(p.minutes||0),0);
      labels.push(`${mon.getMonth()+1}/${mon.getDate()}`); values.push(mins);
    }
  } else if(period==='month'){
    const now=new Date();
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const key=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      const mins=list.filter(p=>String(p.date||'').startsWith(key)).reduce((s,p)=>s+(p.minutes||0),0);
      labels.push(`${d.getMonth()+1}月`); values.push(mins);
    }
  } else {
    for(let i=6;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const key=dstr(d);
      const mins=list.filter(p=>p.date===key).reduce((s,p)=>s+(p.minutes||0),0);
      labels.push(`${d.getMonth()+1}/${d.getDate()}`); values.push(mins);
    }
  }
  return {labels, values};
}
function pomoRemainSec(){
  if(pomoStatus==='running' && pomoEndAt){ return Math.max(0, Math.round((pomoEndAt-Date.now())/1000)); }
  return pomoRemaining;
}
function pomoToggle(){

    pomoRemaining=pomoRemainSec(); pomoEndAt=null; pomoStatus='paused';
    clearInterval(pomoTimer); pomoTimer=null; pomoPersist(); updatePomoDisplay(); return;
  }
  ensureNotify(); ensureAudio();
  if(pomoMode==='focus' && pomoStatus==='idle'){ pomoSessionId=uid(); }
  pomoStatus='running'; pomoEndAt=Date.now()+pomoRemaining*1000;
  if(!pomoTimer){ pomoTimer=setInterval(pomoTick,1000); }
  pomoPersist();
  updatePomoDisplay();
}
function pomoReset(){
  clearInterval(pomoTimer); pomoTimer=null;
  pomoStatus='idle'; pomoEndAt=null; pomoSessionId=null;
  pomoRemaining=(pomoMode==='focus'?pomoFocusMin:pomoBreakMin)*60;
  pomoTotal=pomoRemaining;
  pomoPersist();
  updatePomoDisplay();
}
function pomoTick(){
  if(pomoStatus!=='running') return;
  if(pomoRemainSec()<=0){ completePomo(); return; }
  updatePomoDisplay();
}
function completePomo(){
  clearInterval(pomoTimer); pomoTimer=null;
  if(isPomoWindow){
    // 独立窗口：只负责提醒，把"完成"事件通知主窗口去记录
    if(pomoMode==='focus'){
      notify('番茄完成！', '专注结束，休息一下吧');
      playBeep();
      if(!demoMode){ try{ localStorage.setItem('workbench_pomo_done', JSON.stringify({sessionId:pomoSessionId, mins:Math.round(pomoTotal/60), category:pomoCategory, task:pomoTask||'', date:today(), t:Date.now()})); }catch(e){} }
    } else {
      notify('休息结束', '开始下一个番茄吧');
      playBeep();
      if(!demoMode){ try{ localStorage.setItem('workbench_pomo_done', JSON.stringify({breakEnd:true, t:Date.now()})); }catch(e){} }
    }
    pomoStatus='paused'; pomoRemaining=0;
    updatePomoDisplay();
    return;
  }
  if(pomoMode==='focus'){
    const mins=Math.round(pomoTotal/60);
    const doneKey='pomo_done_'+pomoSessionId;
    const alreadyDone=pomoSessionId&&pomoDoneCheck(doneKey);
    if(!alreadyDone){
      state.pomodoros=state.pomodoros||[];
      state.pomodoros.push({ id:uid(), date:today(), minutes:mins, category:pomoCategory, task:pomoTask||'', schedId:pomoLinkedSchedId||'', createdAt:new Date().toISOString() });
      save(); creditPomoToSchedule(mins);
      toast(`完成一个番茄！已记录 ${mins} 分钟「${pomoCategory}」`);
      if(pomoSessionId){ pomoDoneMark(doneKey); }
    }
    notify('番茄完成！', `专注 ${mins} 分钟「${pomoCategory}」结束，休息一下吧`);
    playBeep();
    pomoMode='break'; pomoTotal=pomoBreakMin*60; pomoRemaining=pomoTotal; pomoSessionId=null;
    if(pomoAutoBreak){ pomoStatus='running'; pomoEndAt=Date.now()+pomoRemaining*1000; pomoTimer=setInterval(pomoTick,1000); }
    else { pomoStatus='idle'; pomoEndAt=null; }
    pomoPersist();
  } else {
    toast('休息结束，开始下一个番茄吧');
    notify('休息结束', '开始下一个番茄吧');
    playBeep();
    pomoMode='focus'; pomoTotal=pomoFocusMin*60; pomoRemaining=pomoTotal; pomoSessionId=null;
    if(pomoAutoNext){ pomoStatus='running'; pomoEndAt=Date.now()+pomoRemaining*1000; pomoTimer=setInterval(pomoTick,1000); }
    else { pomoStatus='idle'; pomoEndAt=null; }

}
function updatePomoDisplay(){

  const bar=$('#pomoBar'); if(bar){ const pct=pomoTotal?(1-remain/pomoTotal)*100:0; bar.style.width=pct+'%'; }
  const ring=$('#pomoRingFill');
  if(ring){
    const pct=pomoTotal?Math.max(0,Math.min(100,(1-remain/pomoTotal)*100)):0;
    ring.setAttribute('stroke-dashoffset',(POMO_C*(1-pct/100)).toFixed(1));
    ring.setAttribute('stroke',pomoMode==='break'?'#16a34a':'#ef4444');
  }
  const st=$('#pomoState'); if(st){ st.textContent=pomoStatus==='running'?(pomoMode==='break'?'休息中':'专注中'):pomoStatus==='paused'?'已暂停':(pomoMode==='break'?'准备休息':'准备专注'); }
  const tbLabel=$('#pomoToggleLabel');
  if(tbLabel){ tbLabel.textContent=pomoStatus==='running'?'暂停':(pomoStatus==='paused'?'继续':(pomoMode==='break'?'开始休息':'开始专注')); }
  const tbBtn=$('#pomoToggleBtn');
  if(tbBtn){
    const c=pomoMode==='break'?'#16a34a':'#ef4444';

    if(icon){
      icon.innerHTML=pomoStatus==='running'

    }
  }
  // 悬浮小窗
  const pf=$('#pomoFloat');
  if(pf){
    pf.classList.toggle('hidden', !pomoFloatVisible);
    if(pomoFloatVisible){
      const pfTime=$('#pfTime'); if(pfTime) pfTime.textContent=pad(Math.floor(remain/60))+':'+pad(remain%60);
      const pfMode=$('#pfMode');
      if(pfMode){

        pfMode.style.background=pomoMode==='focus'?'var(--red-soft)':'var(--green-soft)';
        pfMode.style.color=pomoMode==='focus'?'var(--red)':'var(--green)';

  updateTitle();
}
// 当前阶段追加时长（运行中会同步顺延结束时间）
function pomoAddMin(n){
  n=Number(n)||5;
  const add=n*60;
  pomoTotal+=add;
  if(pomoStatus==='running'&&pomoEndAt){ pomoEndAt+=add*1000; pomoRemaining=pomoRemainSec()+add; }
  else { pomoRemaining+=add; if(pomoEndAt) pomoEndAt+=add*1000; }
  pomoPersist();
  toast(`已增加 ${n} 分钟`);
  if(currentView==='pomodoro') render(); else updatePomoDisplay();
}
// 专注阶段提前结束：按实际已专注的分钟记录（不足 1 分钟不记录）
function pomoFinishNow(){
  if(pomoMode!=='focus'){ pomoSkip(); return; }
  if(pomoStatus==='idle'){ toast('还没开始，先点「开始专注」'); return; }
  clearInterval(pomoTimer); pomoTimer=null;
  const doneSec=pomoTotal-pomoRemainSec();
  const mins=Math.floor(doneSec/60);
  if(mins>=1){
    if(!pomoSessionId) pomoSessionId=uid();
    const doneKey='pomo_done_'+pomoSessionId;
    if(!pomoDoneCheck(doneKey)){
      state.pomodoros=state.pomodoros||[];
      state.pomodoros.push({ id:uid(), date:today(), minutes:mins, category:pomoCategory, task:pomoTask||'', schedId:pomoLinkedSchedId||'', createdAt:new Date().toISOString() });
      save(); creditPomoToSchedule(mins);
      pomoDoneMark(doneKey);
      toast(`已记录 ${mins} 分钟${pomoTask?'「'+pomoTask+'」':''}`);
    }
    notify('番茄结束', `本次专注 ${mins} 分钟，休息一下吧`);
    playBeep();
  } else {
    toast('不足 1 分钟，未记录');
  }
  pomoMode='break'; pomoTotal=pomoBreakMin*60; pomoRemaining=pomoTotal; pomoSessionId=null;
  if(pomoAutoBreak){ pomoStatus='running'; pomoEndAt=Date.now()+pomoRemaining*1000; pomoTimer=setInterval(pomoTick,1000); }
  else { pomoStatus='idle'; pomoEndAt=null; }
  pomoPersist();
  if(currentView==='pomodoro') render(); else updatePomoDisplay();
}
// 跳过当前阶段（不记录）
function pomoSkip(){
  clearInterval(pomoTimer); pomoTimer=null;
  if(pomoMode==='focus'){
    pomoMode='break'; pomoTotal=pomoBreakMin*60; pomoRemaining=pomoTotal;
    pomoStatus=pomoAutoBreak?'running':'idle';
    toast('已结束本段专注（未记录）');
  } else {
    pomoMode='focus'; pomoTotal=pomoFocusMin*60; pomoRemaining=pomoTotal;
    pomoStatus=pomoAutoNext?'running':'idle';
    toast('休息已跳过');
  }
  pomoEndAt=pomoStatus==='running'?Date.now()+pomoRemaining*1000:null;
  if(pomoStatus==='running') pomoTimer=setInterval(pomoTick,1000);
  pomoSessionId=null;
  pomoPersist();
  if(currentView==='pomodoro') render(); else updatePomoDisplay();
}

function loadPomoState(){
  try{ const r=localStorage.getItem('workbench_pomo_state'); if(r) return JSON.parse(r); }catch(e){}
  return null;
}
function pomoPersist(){
  if(demoMode) return;   // 计时器状态也不写本机
  try{
    localStorage.setItem('workbench_pomo_state', JSON.stringify({
      mode:pomoMode, status:pomoStatus, remaining:pomoRemaining, total:pomoTotal,
      endAt:pomoEndAt, category:pomoCategory, focusMin:pomoFocusMin, breakMin:pomoBreakMin,
      sessionId:pomoSessionId||null, task:pomoTask||'',
      autoBreak:pomoAutoBreak, autoNext:pomoAutoNext, sound:pomoSound, notify:pomoNotifyOn
    }));
  }catch(e){}
}
function pomoApply(ps){
  if(!ps) return;
  pomoMode=ps.mode||'focus';
  pomoStatus=ps.status||'idle';
  pomoTotal=ps.total!=null?ps.total:25*60;
  pomoRemaining=ps.remaining!=null?ps.remaining:pomoTotal;
  pomoEndAt=ps.endAt||null;
  pomoCategory=ps.category||'学习';
  pomoFocusMin=ps.focusMin||25;
  pomoBreakMin=ps.breakMin||5;
  pomoSessionId=ps.sessionId||null;
  pomoTask=ps.task||'';
  if(ps.autoBreak!=null) pomoAutoBreak=!!ps.autoBreak;
  if(ps.autoNext!=null) pomoAutoNext=!!ps.autoNext;
  if(ps.sound!=null) pomoSound=!!ps.sound;
  if(ps.notify!=null) pomoNotifyOn=!!ps.notify;
  clearInterval(pomoTimer); pomoTimer=null;
  if(pomoStatus==='running'){
    // 页面关过一段时间再回来：结束时间已过，补一次结算，避免卡在「进行中」
    if(pomoEndAt && pomoEndAt<Date.now()){ setTimeout(()=>{ pomoTick(); },200); }
    else pomoTimer=setInterval(pomoTick,1000);
  }
}
function onPomoStorage(e){
  if(e.key==='workbench_pomo_state'){
    pomoApply(loadPomoState());
    updatePomoDisplay();
    if(!isPomoWindow && currentView==='pomodoro') render();
  } else if(e.key==='workbench_pomo_done'){
    consumePomoDone();
  }
}
function consumePomoDone(){
  if(isPomoWindow||demoMode) return;   // 预览模式不接收真实窗口遗留的完成事件
  try{
    const raw=localStorage.getItem('workbench_pomo_done');
    if(!raw) return;
    const d=JSON.parse(raw);
    localStorage.removeItem('workbench_pomo_done');
    if(d.breakEnd){
      toast('休息结束，开始下一个番茄吧');
      notify('休息结束', '开始下一个番茄吧');
      playBeep();
      clearInterval(pomoTimer); pomoTimer=null;
      pomoMode='focus'; pomoTotal=pomoFocusMin*60; pomoRemaining=pomoTotal; pomoSessionId=null;
      if(pomoAutoNext){ pomoStatus='running'; pomoEndAt=Date.now()+pomoRemaining*1000; pomoTimer=setInterval(pomoTick,1000); }
      else { pomoStatus='idle'; pomoEndAt=null; }
      pomoPersist();
    } else if(d.sessionId){
      const doneKey='pomo_done_'+d.sessionId;
      if(!pomoDoneCheck(doneKey)){
        state.pomodoros=state.pomodoros||[];
        state.pomodoros.push({ id:uid(), date:d.date, minutes:d.mins, category:d.category, task:d.task||'', schedId:pomoLinkedSchedId||'', createdAt:new Date().toISOString() });
        save(); creditPomoToSchedule(d.mins);
        toast(`完成一个番茄！已记录 ${d.mins} 分钟「${d.category}」`);
        pomoDoneMark(doneKey);
      }
      clearInterval(pomoTimer); pomoTimer=null;
      pomoMode='break'; pomoTotal=pomoBreakMin*60; pomoRemaining=pomoTotal; pomoSessionId=null;
      if(pomoAutoBreak){ pomoStatus='running'; pomoEndAt=Date.now()+pomoRemaining*1000; pomoTimer=setInterval(pomoTick,1000); }
      else { pomoStatus='idle'; pomoEndAt=null; }
      pomoPersist();
    }
    updatePomoDisplay();
    if(currentView==='pomodoro') render();
  }catch(e){}
}
function bootPomoWindow(){
  isPomoWindow=true;
  document.body.classList.add('pomo-win-mode');

function openPomoWindow(){

  const url=location.origin+location.pathname+'?pomo=1';

}
function ensureNotify(){
  try{ if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); } }catch(e){}
}
function ensureAudio(){
  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; if(!window._pomoAudioCtx){ window._pomoAudioCtx=new C(); } if(window._pomoAudioCtx && window._pomoAudioCtx.state==='suspended'){ window._pomoAudioCtx.resume(); } }catch(e){}
}
function notify(title, body){
  if(!pomoNotifyOn) return;
  try{ if('Notification' in window && Notification.permission==='granted'){ new Notification(title, {body}); } }catch(e){}
}
function playBeep(force){
  if(!pomoSound && !force) return;
  try{
    ensureAudio();
    const ctx=window._pomoAudioCtx; if(!ctx) return;
    const play=(freq,start,dur)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=freq; o.type='sine';
      o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime+start;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t); o.stop(t+dur);
    };
    play(880,0,0.15); play(880,0.2,0.15); play(1100,0.4,0.3);
  }catch(e){}
}

  });

const SITE_CATS=['AI 工具','开发','设计','学习','效率','资讯','娱乐','生活','其他'];
// 稳定配色：按分类名哈希到固定色板（预设与自定义分类都可用）
const SITE_PALETTE=[['var(--brand)','var(--brand-soft)'],['var(--blue)','var(--blue-soft)'],['var(--purple)','var(--purple-soft)'],['var(--green)','var(--green-soft)'],['var(--orange)','var(--orange-soft)'],['var(--red)','var(--red-soft)']];
function normUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }
function siteColorOf(cat){ let h=0; const s=String(cat||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return SITE_PALETTE[h%SITE_PALETTE.length]; }
function siteColor(cat){ return siteColorOf(cat)[0]; }
function siteColorSoft(cat){ return siteColorOf(cat)[1]; }
function siteDomain(u){ try{ return new URL(normUrl(u)).hostname.replace(/^www\./,''); }catch(e){ return normUrl(u); } }
function siteInitial(t){ return esc((t||'?').trim().charAt(0).toUpperCase()); }

            <button class="btn-icon" data-action="site-del" data-id="${s.id}" title="删除"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg></button>

/* ================= 例行事项 ================= */
// 数据结构：{ id, name, freq('daily'|'weekly'|'monthly'), weekdays:[1,2,3](仅weekly，0=周日), monthDay:number|'end'(仅monthly), note, done:true(是否本轮已完成), createdAt }
const ROUTINE_WD=['日','一','二','三','四','五','六'];
// 例行事项分类
const ROUTINE_CATS=[
  {key:'work',label:'工作',color:'#4f5ef7',soft:'#eef0ff'},
  {key:'study',label:'学习',color:'#2563eb',soft:'#eaf1fe'},
  {key:'life',label:'生活',color:'#16a34a',soft:'#e8f7ee'},
  {key:'health',label:'健康',color:'#f59e0b',soft:'#fef3e0'},
  {key:'other',label:'其他',color:'#9aa0ac',soft:'#f1f2f5'}
];
function routineCat(k){ return ROUTINE_CATS.find(c=>c.key===k)||ROUTINE_CATS[ROUTINE_CATS.length-1]; }
function routineFreqLabel(r){
  if(r.freq==='daily') return '每天';
  if(r.freq==='weekly'){ const wd=(r.weekdays||[]).map(Number).sort((a,b)=>a-b); if(wd.length===7) return '每天'; return '每周 '+wd.map(i=>ROUTINE_WD[i]).join('、'); }
  if(r.freq==='monthly'){ return r.monthDay==='end'?'每月底':`每月 ${r.monthDay} 号`; }
  return '';
}
// 判断「本轮（当前周期）」是否已到该做的时点
function routineDueNow(r){
  const d=new Date();
  if(r.freq==='daily') return true;
  if(r.freq==='weekly') return (r.weekdays||[]).map(Number).includes(d.getDay());
  if(r.freq==='monthly'){
    if(r.monthDay==='end'){ const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()===last; }
    return d.getDate()===Number(r.monthDay);
  }
  return false;
}
// 判断某天（指定日期）是否应做该例行事项（用于近 7 天打卡率统计）
function routineDueOnDate(r, dateStr){
  const d=new Date(dateStr+'T00:00:00');
  if(r.freq==='daily') return true;
  if(r.freq==='weekly') return (r.weekdays||[]).map(Number).includes(d.getDay());
  if(r.freq==='monthly'){
    if(r.monthDay==='end'){ const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()===last; }
    return d.getDate()===Number(r.monthDay);
  }
  return false;
}
// 打卡按日期独立：doneLog[日期]=true 表示「那天该做的这次」已完成
function routineDoneOn(r, dateStr){ return !!(r.doneLog && r.doneLog[dateStr]); }
function routineDone(r){ return routineDoneOn(r, today()); }
function toggleRoutineDone(r, dateStr){
  if(!r.doneLog) r.doneLog={};
  if(r.doneLog[dateStr]) delete r.doneLog[dateStr]; else r.doneLog[dateStr]=true;
}
// 旧数据迁移：全局布尔 done → 按日期 doneLog（done=true 视为今天已完成）
function migrateRoutineDoneLog(){
  (state.routines||[]).forEach(r=>{
    if(!r.doneLog){
      r.doneLog={};
      if(r.done===true) r.doneLog[today()]=true;
      delete r.done;
    }
  });
}
// 旧数据迁移：计划 / 例行事项补上分类字段（默认「其他」）
function migrateItemCats(){
  (state.plans||[]).forEach(p=>{ if(!p.cat) p.cat='other'; });
  (state.routines||[]).forEach(r=>{ if(!r.cat) r.cat='other'; });
}
// 今日待办数（到点且未完成）
function routineDueCount(){ return (state.routines||[]).filter(r=>routineDueNow(r)&&!routineDone(r)).length; }

function renderRoutines(){
  const all=state.routines||[];
  if(!all.length) return emptyBox('repeat','还没有例行事项','把定期要做的事记下来，按时打卡督促自己','add-routine');
  // 今日待办（到点且未完成）
  const dueNow=all.filter(r=>routineDueNow(r)&&!routineDone(r));
  const dueBanner=dueNow.length?`<div class="routine-due">
    <div class="rd-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <div class="rd-main"><div class="rd-title">今天有 ${dueNow.length} 件例行事项待完成</div><div class="rd-sub">${dueNow.map(r=>esc(r.name)).join(' · ')}</div></div>
  </div>`:'';
  // 筛选 chips
  const cats=['全部','今日待办','未完成','已完成'];
  const statusChips=cats.map(c=>`<button class="chip ${routineFilter===c?'active':''}" data-action="routine-filter" data-filter="${esc(c)}">${esc(c)}</button>`).join('');
  const catChips=['全部',...ROUTINE_CATS].map(c=>{ const key=c==='全部'?'全部':c.key, sel=routineCatFilter===key, col=c==='全部'?null:c; return `<button class="chip ${sel?'active':''}" data-action="routine-cat" data-filter="${key}" ${col?`style="${sel?`background:${col.color};border-color:${col.color};color:#fff`:`border-color:${col.color};color:${col.color}`}"`:''}>${c==='全部'?'全部':c.label}</button>`; }).join('');
  const filterBar=`<div class="filter-bar">${statusChips}<span class="filter-sep">·</span>${catChips}</div>`;
  // 列表
  let list=all;
  if(routineFilter==='今日待办') list=all.filter(r=>routineDueNow(r)&&!routineDone(r));
  if(routineFilter==='未完成') list=all.filter(r=>!routineDone(r));
  if(routineFilter==='已完成') list=all.filter(r=>routineDone(r));
  if(routineCatFilter!=='全部') list=list.filter(r=>r.cat===routineCatFilter);
  // 排序：未完成在前、今日待办最前，再按创建时间
  list=[...list].sort((a,b)=>{
    const ad=routineDueNow(a)&&!routineDone(a), bd=routineDueNow(b)&&!routineDone(b);
    if(ad!==bd) return ad?-1:1;
    const ao=!routineDone(a), bo=!routineDone(b);
    if(ao!==bo) return ao?-1:1;
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });
  const cards=list.map(r=>{
    const done=routineDone(r); const c=routineCat(r.cat);
    return `<div class="card routine-card ${done?'done':''}" style="border-left:4px solid ${c.color}">
      <button class="routine-check" data-action="routine-toggle" data-id="${r.id}" title="${done?'取消完成':'标记完成'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
      <div class="routine-main">
        <div class="routine-name">${esc(r.name)}</div>
        <div class="routine-meta">
          <span class="routine-freq" style="background:${c.soft};color:${c.color}">${esc(c.label)}</span>
          <span class="routine-freq">${esc(routineFreqLabel(r))}</span>
          ${routineDueNow(r)?`<span class="routine-next" style="color:${done?'var(--green)':'var(--orange)'};font-weight:600">${done?'本轮已完成':'今日待办'}</span>`:''}
        </div>
        ${r.note?`<div class="routine-note">${esc(r.note)}</div>`:''}
      </div>
      <div class="t-ops">
        <button class="btn-icon" data-action="routine-edit" data-id="${r.id}" title="编辑"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg></button>
        <button class="btn-icon" data-action="routine-del" data-id="${r.id}" title="删除"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg></button>
      </div>
    </div>`;
  }).join('');
  if(!list.length) return dueBanner+filterBar+`<div class="card empty"><p>该筛选下没有事项</p></div>`;
  return dueBanner+filterBar+`<div class="grid">${cards}</div>`;
}

function routineFreqChange(v){

  if(w) w.style.display=v==='weekly'?'':'none';
  if(m) m.style.display=v==='monthly'?'':'none';
}
function routineWdToggle(btn){
  btn.classList.toggle('sel');
}
function submitRoutine(e,id){
  e.preventDefault();
  const f=e.target;
  const name=(f.name.value||'').trim();
  if(!name){ toast('请填写事项名称'); return; }
  const freq=f.freq.value;
  let weekdays=[], monthDay=1;
  if(freq==='weekly'){
    const wdEls=e.target.querySelectorAll('.emoji-opt.sel');
    weekdays=Array.from(wdEls).map(b=>Number(b.dataset.wd));
    if(!weekdays.length){ toast('请至少选择一个星期'); return; }
  }
  if(freq==='monthly'){ monthDay=f.monthDay.value==='end'?'end':Number(f.monthDay.value); }
  const data={ name, freq, weekdays, monthDay, note:(f.note.value||'').trim(), cat:(f.cat&&f.cat.value)||'other' };
  if(id){ const it=state.routines.find(x=>x.id===id); if(it) Object.assign(it,data); toast('已保存'); }
  else{ state.routines.push({ id:uid(), done:false, createdAt:today(), ...data }); toast('已添加'); }
  save(); closeModal(); render();
}

function submitSite(e,id){
  e.preventDefault();
  const f=e.target;
  const free=(f.categoryFree.value||'').trim();
  const cat=free||f.category.value||'其他';
  const data={ title:(f.title.value||'').trim(), url:(f.url.value||'').trim(), category:cat, note:(f.note.value||'').trim() };
  if(!data.title||!data.url){ toast('请填写名称和链接'); return; }
  if(id){ const it=state.sites.find(x=>x.id===id); if(it) Object.assign(it,data); toast('已保存'); }
  else{ state.sites.push({ id:uid(), createdAt:today(), ...data }); toast('已添加'); }
  save(); closeModal(); render();
}

  o+=`<h2>十五、每日一句</h2>`;

        if(m.genre||m.tags&&m.tags.length) o+=`<p style="margin:0 0 4px;color:#666;font-size:12px">${E(m.genre||'')}${(m.tags||[]).length?' · 标签：'+E((m.tags||[]).join('、')):''}</p>`;

        if(ens.length){ o+=`<p style="margin:2px 0 4px"><b>笔记（${ens.length} 条）</b></p>`; ens.forEach(en=>{ o+=`<p style="margin:2px 0 6px">${E(en.date||'')} · ${E(en.kind||'笔记')}${en.loc?' · '+E(en.loc):''}<br>${E(en.text||'')}</p>`; }); }
      });
    });
  } else o+=`<p>（无）</p>`;

  o+=`</body></html>`;
  const blob=new Blob(['\ufeff'+o],{type:'application/msword;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`工作台数据-${today()}.doc`; a.click(); URL.revokeObjectURL(a.href);
  toast('Word 文档已导出');
