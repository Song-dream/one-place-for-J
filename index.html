<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的工作台 · 日历 / 待办 / 计划 / 副业 / 财务 / 心情</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --border:#e7e9ee; --border-strong:#d8dbe2;
    --text:#1b1f2a; --text-2:#6b7280; --text-3:#9aa0ac;
    --brand:#4f5ef7; --brand-soft:#eef0ff; --brand-dark:#3a45d0;
    --green:#16a34a; --green-soft:#e8f7ee;
    --red:#dc2626; --red-soft:#fdecec;
    --orange:#f59e0b; --orange-soft:#fef3e0;
    --blue:#2563eb; --blue-soft:#eaf1fe;
    --purple:#7c3aed; --purple-soft:#f3edff;
    --pink:#e11d74; --pink-soft:#fdeaf3;
    --gray-soft:#f1f2f5;
    --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,24,40,.03),0 3px 12px rgba(20,24,40,.045);
    --shadow-lg:0 8px 30px rgba(20,24,40,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
  a{color:var(--brand);text-decoration:none}
  svg{display:block}
  .hidden{display:none!important}

  .app{display:flex;min-height:100vh}
  .sidebar{
    width:216px;flex:0 0 216px;background:var(--card);border-right:1px solid var(--border);
    padding:20px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;
    overflow:hidden;
  }
  .logo{padding:4px 10px 16px}
  .logo h1{font-size:17px;font-weight:700}
  .logo p{font-size:11.5px;color:var(--text-3);margin-top:2px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-2);font-weight:500;transition:.15s;width:100%;text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none}
  .nav-item:hover{background:var(--gray-soft);color:var(--text)}
  .nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav-item .n-count{margin-left:auto;font-size:11px;background:var(--brand);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
  .nav-item:not(.active) .n-count{background:var(--gray-soft);color:var(--text-2)}
  /* 分类多时只滚动导航区，底部操作按钮始终固定可见 */
  .side-nav{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;padding-right:2px}
  .side-nav::-webkit-scrollbar{width:6px}
  .side-nav::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px}
  .side-nav::-webkit-scrollbar-track{background:transparent}
  .nav-grip{flex:0 0 auto;display:flex;align-items:center;color:var(--text-3);opacity:0;transition:.15s;cursor:grab;margin-left:-4px}
  .nav-item:hover .nav-grip{opacity:.55}
  .nav-item .nav-grip:hover{opacity:1;color:var(--brand)}
  .nav-item.dragging{opacity:.35}
  .nav-item.drag-over{border-top:2px solid var(--brand)}
  .side-foot{margin-top:10px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;flex:0 0 auto}

  .main{flex:1;min-width:0;padding:24px 28px 60px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h2{font-size:22px;font-weight:700}
  .page-head .sub{color:var(--text-2);font-size:13px;margin-top:3px}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap}

  .topbar{display:none;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;align-items:center;justify-content:space-between}
  .topbar h1{font-size:16px;font-weight:700}
  .topbar .actions{display:flex;gap:6px}
  .bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--text-3);padding:4px 2px;border-radius:8px;flex:1;min-width:0}
  .bottom-item.active{color:var(--brand);font-weight:600}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.15s;border:1px solid transparent}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:var(--card);border-color:var(--border-strong);color:var(--text)}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn-danger{background:var(--red-soft);color:var(--red)}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .btn-icon{padding:7px;border-radius:8px;color:var(--text-3);transition:.12s}
  .btn-icon:hover{background:var(--gray-soft);color:var(--text)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}

  .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6}
  .tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--gray-soft);color:var(--text-2)}

  .chip{padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--border-strong);color:var(--text-2);transition:.13s}
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

  .empty{text-align:center;padding:44px 20px;color:var(--text-2)}
  .empty .icon{width:52px;height:52px;border-radius:14px;background:var(--gray-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--text-3)}
  .empty h3{font-size:15px;color:var(--text);margin-bottom:4px}
  .empty p{font-size:12.5px;margin-bottom:14px}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
  .input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:10px;background:#fff;outline:none;transition:.15s}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .textarea{resize:vertical;min-height:80px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .hint{font-size:11.5px;color:var(--text-3);margin-top:4px}

  .overlay{position:fixed;inset:0;background:rgba(15,18,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .overlay .sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  @media(min-width:640px){.overlay{align-items:center;padding:20px}.overlay .sheet{border-radius:18px}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .sheet-head h3{font-size:17px;font-weight:700}

  .welcome{padding:4px 2px 18px}
  .welcome h2{font-size:24px;font-weight:800}
  .welcome .date{color:var(--text-2);font-size:13px;margin-top:4px}
  .quick-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .dash-card{padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .dash-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
  .dash-card .dc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .dash-card .dc-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .dash-card .dc-label{font-size:12px;color:var(--text-2);font-weight:600}
  .dash-card .dc-val{font-size:24px;font-weight:800;margin-top:2px}
  .dash-card .dc-sub{font-size:12px;color:var(--text-3);margin-top:4px}
  .dash-card .go{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:12px;opacity:0;transition:.15s}
  .dash-card:hover .go{opacity:1}
  .mini-bar{height:6px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:10px}
  .mini-bar i{display:block;height:100%;border-radius:99px}

  /* 首页「本周复盘」可视化 + 导出 */
  .dash-review{padding:16px 18px}
  .dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .dr-head h3{font-size:15px;font-weight:700}
  .dr-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:center}
  .dr-chart svg{display:block}
  .rv-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .rv-stat{min-width:0}
  .rv-k{font-size:11.5px;color:var(--text-2);font-weight:600}
  .rv-v{font-size:21px;font-weight:800;margin-top:3px;line-height:1.15}
  .rv-sub{font-size:11px;color:var(--text-3);margin-top:1px}
  @media(max-width:720px){ .dr-grid{grid-template-columns:1fr;gap:12px} }

  .plan-card{padding:16px}
  .plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
  .plan-title{font-size:15.5px;font-weight:650;flex:1}
  .plan-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text-2);font-size:12px;margin-bottom:10px}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin:8px 0}
  .progress-bar{flex:1;height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
  .progress-fill{height:100%;border-radius:99px;background:var(--brand);transition:width .3s}
  .progress-num{font-size:12px;font-weight:700;color:var(--text-2);min-width:38px;text-align:right}
  input[type=range]{flex:1;accent-color:var(--brand)}
  .plan-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .review-block{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
  .review-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
  .review-item:last-child{border-bottom:none}
  .review-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .review-body{color:var(--text);white-space:pre-wrap}
  .review-next{color:var(--blue);font-size:12px;margin-top:3px}
  .review-ops{margin-left:auto;display:flex;gap:2px}
  .review-ops .btn-icon{padding:4px}

  .stat-strip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .stat-pill{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 16px;display:flex;align-items:baseline;gap:8px;box-shadow:var(--shadow)}
  .stat-pill b{font-size:18px}
  .stat-pill span{font-size:12px;color:var(--text-2)}

  /* ===== 计划与复盘 · 看板（可视化总览 / 周期并列 / 按计划） ===== */
  .pb-overview{padding:16px 18px;margin-bottom:14px}
  .pb-ov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .pb-ov-head h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .pb-ov-head .pb-hint{font-size:11.5px;color:var(--text-3);font-weight:400}
  .pb-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .pb-kpi{background:var(--gray-soft);border-radius:11px;padding:10px 12px;min-width:0}
  .pb-kpi b{display:block;font-size:20px;font-weight:800;line-height:1.2}
  .pb-kpi span{font-size:11px;color:var(--text-2)}
  .pb-ov-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
  .pb-sec-t{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:9px;letter-spacing:.2px}
  .pb-tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .pb-tier-card{border:1px solid var(--border);border-radius:12px;padding:11px 12px;text-align:left;transition:.15s;background:var(--card);min-width:0}
  .pb-tier-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--brand)}
  .pb-tier-card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .pb-tier-card .tc-top{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .pb-tier-card .tc-name{font-size:12.5px;font-weight:700;color:var(--text-2)}
  .pb-tier-card .tc-num{font-size:22px;font-weight:800;line-height:1.1}
  .pb-tier-card .tc-sub{font-size:10.5px;color:var(--text-3);margin-top:3px}
  .pb-mini-bar{height:6px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:8px}
  .pb-mini-bar i{display:block;height:100%;border-radius:99px}
  .pb-stack{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--gray-soft);margin-bottom:8px}
  .pb-stack i{display:block;height:100%;min-width:0}
  .pb-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--text-2)}
  .pb-legend span{display:inline-flex;align-items:center;gap:5px}
  .pb-legend em{width:8px;height:8px;border-radius:3px;display:inline-block;font-style:normal}
  .pb-dist-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px}
  .pb-dist-row .lab{width:34px;flex:0 0 auto;color:var(--text-2)}
  .pb-dist-row .bar{flex:1;height:7px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
  .pb-dist-row .bar i{display:block;height:100%;border-radius:99px}
  .pb-dist-row .cnt{width:26px;text-align:right;color:var(--text-3)}
  .pb-reminds{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .pb-remind{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;background:var(--gray-soft);font-size:11.5px;color:var(--text-2);transition:.13s;text-align:left}
  .pb-remind:hover{background:var(--brand-soft);color:var(--brand)}
  .pb-remind b{color:var(--text);font-weight:600}
  .pb-remind.warn{background:var(--orange-soft);color:#92620a}
  .pb-remind.warn b{color:#92620a}
  .pb-heat{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;overflow-x:auto}
  .pb-heat-title{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:6px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .pb-heat-title span{font-weight:400;color:var(--text-3);font-size:11px}

  .pb-tabs{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:11;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);flex-wrap:wrap;align-items:center}
  .pb-tab{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:700;border:1px solid var(--border-strong);background:var(--card);color:var(--text-2);transition:.13s;flex:1 1 0;min-width:96px;justify-content:center}
  .pb-tab:hover{border-color:var(--brand);color:var(--brand)}
  .pb-tab .n{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--gray-soft);color:var(--text-2)}
  .pb-tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .pb-tab.active .n{background:rgba(255,255,255,.24);color:#fff}
  .pb-tabs-lead{font-size:11.5px;font-weight:700;color:var(--text-3);flex:0 0 auto}

  .pb-subbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .pb-subbar-lead{font-size:11.5px;color:var(--text-3);font-weight:600;flex:0 0 auto}
  .pb-subbar-hint{font-size:11px;color:var(--text-3);flex:1 1 auto;min-width:130px}
  .pb-subtab{padding:6px 14px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--border-strong);color:var(--text-2);background:var(--card)}
  .pb-subtab.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .pb-view-toggle{display:inline-flex;gap:6px;align-items:center;margin-left:auto;flex:0 0 auto}
  .pb-view-lead{font-size:11px;color:var(--text-3)}

  .pb-short-list{display:flex;flex-direction:column;gap:8px}
  .pb-short-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:11px 14px;border-radius:11px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border-strong);transition:.13s}
  .pb-short-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
  .pb-short-row .nm{font-size:13.5px;font-weight:650;min-width:0;word-break:break-word}
  .pb-short-row .bar{width:92px;flex:0 0 auto}
  .pb-short-row .pct{font-size:11.5px;font-weight:700;color:var(--text-2);width:34px;text-align:right;flex:0 0 auto}
  .pb-short-row .ops{display:flex;gap:2px;flex:0 0 auto;margin-left:auto}

  .pb-focus-nav{display:flex;gap:8px;overflow-x:auto;align-items:center;padding:10px 12px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;position:sticky;top:64px;z-index:10;box-shadow:var(--shadow)}
  .pb-focus-nav .lead{font-size:11.5px;font-weight:700;color:var(--text-3);flex:0 0 auto}
  .pb-focus-nav .chip{flex:0 0 auto;white-space:nowrap}
  .pb-focus-nav .chip .fn{font-size:10px;opacity:.75;margin-left:3px;font-weight:600}

  .pb-focus{padding:18px}
  .pb-focus-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
  .pb-ring{width:78px;height:78px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .pb-ring::after{content:'';position:absolute;inset:9px;background:var(--card);border-radius:50%}
  .pb-ring span{position:relative;z-index:1;font-size:17px;font-weight:800}
  .pb-focus-info{flex:1;min-width:180px}
  .pb-focus-info h3{font-size:18px;font-weight:750;margin-bottom:7px;word-break:break-word}
  .pb-focus-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--text-2)}
  .pb-focus-stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
  .pb-focus-stats .s{background:var(--gray-soft);border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--text-2)}
  .pb-focus-stats .s b{color:var(--text);font-size:13px}

  .pb-quick{padding:14px;border:1px dashed var(--border-strong);border-radius:11px;background:var(--gray-soft);margin:14px 0}
  .pb-quick h4{font-size:12.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .pb-quick .qf-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .pb-quick .qf-row>*{flex:0 0 auto}
  .pb-quick .input,.pb-quick .select{background:var(--card)}
  .pb-quick textarea{width:100%}

  .pb-tl{position:relative;padding-left:20px;margin-top:6px}
  .pb-tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border);border-radius:2px}
  .pb-tl-item{position:relative;padding:0 0 14px 8px}
  .pb-tl-item::before{content:'';position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--card);box-shadow:0 0 0 2px var(--brand-soft)}
  .pb-tl-item.lv-周::before{background:var(--purple);box-shadow:0 0 0 2px var(--purple-soft)}
  .pb-tl-item.lv-月::before{background:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}

  .pw-hint{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:2px}
  .pw-close{position:fixed;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--gray-soft);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;background:#1b1f2a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1}

  /* 登录界面 */
  .auth-screen{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
  .auth-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px 28px;box-shadow:var(--shadow-lg)}
  .auth-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin:0 auto 14px}
  .auth-card h2{text-align:center;font-size:20px;font-weight:700}
  .auth-sub{text-align:center;color:var(--text-2);font-size:12.5px;margin:6px 0 22px;line-height:1.6}
  .auth-error{display:none;color:var(--red);background:var(--red-soft);font-size:12.5px;border-radius:9px;padding:9px 12px;margin:12px 0 0;line-height:1.5}
  .auth-notice{background:var(--orange-soft);color:#92400e;font-size:12px;border-radius:9px;padding:9px 12px;margin-bottom:14px;line-height:1.7;text-align:left}
  .auth-notice a{font-weight:600;word-break:break-all}
  .auth-hint{text-align:center;color:var(--text-3);font-size:11px;margin-top:16px;line-height:1.5}
  .btn-wechat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:11px;background:#07c160;color:#fff;font-weight:600;font-size:14px;transition:.15s}
  .btn-wechat:hover{background:#06ad56}
  .auth-divider{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:12px;margin:18px 0}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .auth-field{width:100%;padding:11px 13px;border:1.5px solid var(--border-strong);border-radius:11px;background:#fff;outline:none;transition:.15s;margin-bottom:10px}
  .auth-field:focus{border-color:var(--brand)}
  .auth-row{display:flex;gap:8px}
  .auth-row .auth-field{flex:1;margin-bottom:0}
  .auth-row .btn{flex:0 0 auto;white-space:nowrap}
  .btn-block{width:100%;justify-content:center;margin-top:10px}
  .auth-loading{text-align:center;color:var(--text-2);padding:30px 0}
  .auth-loading .spin{width:30px;height:30px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 用户信息 */
  .user-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;background:var(--gray-soft)}
  .user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto;overflow:hidden}
  .user-avatar img{width:100%;height:100%;object-fit:cover}
  .user-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  @media(max-width:820px){
    .sidebar{display:none}
    .topbar{display:flex}
    .bottombar{display:flex}
    .main{padding:18px 14px calc(88px + env(safe-area-inset-bottom))}
    .grid-2,.grid-3{grid-template-columns:1fr}
    .dash-grid{grid-template-columns:1fr}
    .stat-cards{grid-template-columns:repeat(2,1fr)}
    .page-head h2{font-size:19px}
    .welcome h2{font-size:21px}
  }
  /* ===== 首页概览：Hero + 每日一句 ===== */
  .hero{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    padding:22px 26px;border-radius:18px;margin-bottom:14px;color:#fff;
    background:linear-gradient(120deg,#4f5ef7 0%,#6d5cf0 45%,#9b5de5 100%);
    box-shadow:0 10px 28px rgba(79,94,247,.18)}
  .hero-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
  .hero-deco.d1{width:220px;height:220px;right:-40px;top:-110px}
  .hero-deco.d2{width:130px;height:130px;left:38%;bottom:-90px;background:rgba(255,255,255,.08)}
  .hero-main,.hero-side{position:relative;z-index:1}
  .hero-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.5px;opacity:.85;margin-bottom:6px}
  .hero h2{font-size:25px;font-weight:800;letter-spacing:.3px}
  .hero-spark{font-size:18px;opacity:.9}
  .hero .date{font-size:12.5px;opacity:.9;margin-top:6px}
  .hero .date b{font-weight:800}
  .hero-bar{width:220px;max-width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,.24);margin-top:12px;overflow:hidden}
  .hero-bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
  .hero-side{display:flex;gap:10px}
  .hero-kpi{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:10px 16px;min-width:104px;text-align:center}
  .hero-kpi b{display:block;font-size:22px;font-weight:800;line-height:1.2}
  .hero-kpi b small{font-size:12px;font-weight:600;opacity:.85}
  .hero-kpi span{font-size:10.5px;opacity:.85}
  .quick-btn{transition:.16s}
  .quick-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}

  .dq-card{position:relative;overflow:hidden;padding:20px 26px 18px;margin-bottom:14px;border-radius:16px;border:1px solid #e6e2ff;
    background:linear-gradient(115deg,#f7f6ff 0%,#fdf7ff 55%,#fff9f2 100%);box-shadow:var(--shadow)}
  .dq-glow{position:absolute;right:-60px;bottom:-100px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.10),transparent 70%);pointer-events:none}
  .dq-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
  .dq-label{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--purple);letter-spacing:.3px}
  .dq-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .dq-btn{border:1px solid var(--border-strong);background:rgba(255,255,255,.75);color:var(--text-2);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:600;transition:.13s}
  .dq-btn:hover{border-color:var(--brand);color:var(--brand);background:#fff}
  .dq-manage{margin-left:4px}
  .dq-mark{font-family:Georgia,serif;font-size:56px;line-height:.8;color:rgba(124,58,237,.20);margin:6px 0 -8px;position:relative;z-index:1}
  .dq-text{font-size:19px;font-weight:700;line-height:1.75;color:#232038;letter-spacing:.4px;max-width:820px;position:relative;z-index:1;min-height:34px}
  .dq-by{margin-top:10px;font-size:12.5px;color:var(--text-2);position:relative;z-index:1}
  .dq-by span+span{color:var(--text-3)}
  .dq-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
  .dq-tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--purple);background:#f0eaff;border-radius:6px;padding:2px 8px;margin-right:5px}
  .dq-counter{font-size:11px;color:var(--text-3)}
  .dq-fade .dq-text,.dq-fade .dq-by{animation:dqIn .45s ease}
  @keyframes dqIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 每日一句管理页 */
  .q-quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
  .q-quick .input{flex:1 1 180px}
  .q-quick .input:nth-child(2),.q-quick .input:nth-child(3){flex:0 1 150px}
  .q-tools{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
  .q-chips{display:flex;gap:7px;flex-wrap:wrap}
  .q-chips .chip{padding:4px 11px;font-size:11.5px}
  .q-stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11.5px;color:var(--text-2)}
  .q-stats .s-item{background:var(--gray-soft);border-radius:6px;padding:3px 9px}
  .q-stats .s-item b{color:var(--text)}
  .q-stats-hint{color:var(--text-3)}
  .q-grid{align-items:start}
  .q-item{padding:14px 16px}
  .q-item-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .q-idx{font-size:11px;font-weight:800;color:var(--purple);background:var(--purple-soft);border-radius:6px;padding:2px 7px}
  .q-item-tags{flex:1;min-width:0}
  .q-ops{margin-left:auto;display:flex;gap:1px;flex:0 0 auto}
  .q-ops .btn-icon{padding:4px}
  .q-text{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap}
  .q-by{font-size:11.5px;color:var(--text-2);margin-top:8px}
  .q-by span{color:var(--text-3)}
  .q-time{font-size:10.5px;color:var(--text-3);margin-top:6px}

  /* 心情记录 */
  .mood-quick{padding:16px 18px;margin-bottom:14px}
  .mq-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .mq-head h3{font-size:15px;font-weight:700}
  .mq-head div span{font-size:11.5px;color:var(--text-3)}
  .mq-state{font-size:11.5px;color:var(--text-3);background:var(--gray-soft);border-radius:8px;padding:4px 10px}
  .mq-state.has{background:var(--green-soft);color:var(--green)}
  .mq-state b{font-size:14px}
  .mq-scores{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
  .mq-score{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--border-strong);background:#fff;font-size:14px;font-weight:700;color:var(--text-2);transition:.14s}
  .mq-score:hover{border-color:var(--mc);color:#fff;background:var(--mc);transform:translateY(-2px)}
  .mq-score.sel{background:var(--mc);border-color:var(--mc);color:#fff}
  .mq-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text-3)}
  .mood-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .mood-kpi{padding:12px 14px}
  .mood-kpi .k{font-size:11.5px;color:var(--text-2);font-weight:600}
  .mood-kpi .v{font-size:24px;font-weight:800;line-height:1.3}
  .mood-kpi .s{font-size:10.5px;color:var(--text-3)}
  .mood-sec-t{font-size:14px;font-weight:700;margin-bottom:10px}
  .mood-sec-note{font-size:10.5px;color:var(--text-3);margin-top:5px}
  .mood-heat-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .mood-heat-svg{flex:0 1 360px;min-width:240px;overflow-x:auto}
  .mood-heat-side{flex:1;min-width:190px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mhs-item{background:var(--gray-soft);border-radius:10px;padding:9px 10px}
  .mhs-item b{display:block;font-size:18px;font-weight:800}
  .mhs-item span{font-size:10.5px;color:var(--text-2)}
  .mhs-note{grid-column:1/-1;font-size:11px;color:var(--text-3);line-height:1.7;margin-top:2px}
  .mood-dual{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .mood-group{margin-bottom:14px}
  .mood-group-t{font-size:12.5px;font-weight:700;color:var(--text-2);margin:0 0 8px 2px}
  .mood-group-t span{font-weight:400;color:var(--text-3);font-size:11px}
  .mood-entry{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border-strong);border-radius:11px;padding:11px 14px;margin-bottom:8px}
  .me-dot{width:34px;height:34px;border-radius:10px;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .me-body{flex:1;min-width:0}
  .me-head{display:flex;align-items:baseline;gap:8px;font-size:13px}
  .me-head span{font-size:11px;color:var(--text-3)}
  .me-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .me-note{font-size:12.5px;color:var(--text-2);margin-top:6px;white-space:pre-wrap}
  .me-ops{display:flex;gap:1px;flex:0 0 auto}
  .me-ops .btn-icon{padding:4px}

  /* 录入表单分组 & 步骤编辑器 */
  .grp-form .form-sec{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fcfcfe}
  .form-sec-t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:12px;color:var(--text)}
  .form-sec-t>span{width:20px;height:20px;border-radius:7px;background:var(--brand);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
  .form-sec-t small{font-weight:400;color:var(--text-3);font-size:11px}
  .f-main{font-size:10px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:1px 6px;margin-left:4px}
  .f-hint{font-size:10.5px;color:var(--text-3);margin-top:3px}
  .step-editor{display:flex;flex-direction:column;gap:7px}
  .step-row{display:flex;align-items:center;gap:8px}
  .step-no{width:22px;height:22px;border-radius:7px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .step-row .input{flex:1;min-width:0}

  /* 条目呈现 */
  .wh-main{margin-top:9px;border-top:1px dashed var(--border);padding-top:8px}
  .wh-main summary{cursor:pointer;font-size:12px;color:var(--text-2);line-height:1.6;list-style:none}
  .wh-main summary::-webkit-details-marker{display:none}
  .wh-expand{color:var(--brand);font-size:11px;margin-left:6px}
  .wh-main[open] .wh-expand{display:none}
  .wh-full{font-size:12px;color:var(--text-2);white-space:pre-wrap;line-height:1.75;background:var(--gray-soft);border-radius:8px;padding:9px 11px;margin-top:7px;max-height:280px;overflow:auto}
  .sop-count{font-size:10.5px;font-weight:700;color:var(--text-2);background:var(--gray-soft);border-radius:6px;padding:2px 8px}
  .sop-more{margin-top:6px}
  .sop-more summary{cursor:pointer;font-size:11.5px;color:var(--brand);font-weight:600;padding:5px 0}
  .bottombar{overflow-x:auto;justify-content:flex-start}
  .bottombar .bottom-item{flex:0 0 auto;min-width:52px}
  @media(max-width:900px){ .mood-kpis{grid-template-columns:repeat(2,1fr)} .mood-dual{grid-template-columns:1fr} }
  @media(max-width:600px){
    .hero{padding:18px}.hero h2{font-size:21px}.hero-side{width:100%}
    .dq-card{padding:16px}.dq-text{font-size:16px}.dq-mark{font-size:44px}
    .q-quick .input,.q-quick .input:nth-child(2),.q-quick .input:nth-child(3){flex:1 1 100%}
    .mood-heat-svg{flex:1 1 100%}
  }

  /* ============ v2 优化：情绪趋势 / 时间轴 / 番茄钟 / 财务 ============ */
  .wb-hintline{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text-2);background:var(--brand-soft);border:1px solid #e0e4ff;border-radius:10px;padding:9px 12px;line-height:1.65;margin-bottom:14px}
  .wb-hintline b{color:var(--brand-dark)}
  .wb-mini{font-size:11px;color:var(--text-3)}
  .wb-insight{margin-top:10px;background:var(--gray-soft);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--text-2);line-height:1.75}
  .chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .chart-head h3{font-size:14px;font-weight:700}
  .chart-range{display:flex;gap:5px}
  .chart-foot{font-size:11px;color:var(--text-3);text-align:center;margin-top:2px}

  /* 财务 · 大额支出 */
  .big-exp-card{background:linear-gradient(135deg,#fff5f5 0%,#fff 70%);border:1px solid #f9dcdc;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .big-exp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .big-exp-amount{font-size:30px;font-weight:800;color:var(--red);line-height:1.15}
  .big-exp-name{font-size:14px;font-weight:700;color:var(--text)}
  .big-exp-meta{font-size:11.5px;color:var(--text-3);margin-top:2px}
  .big-exp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;flex-wrap:wrap}
  .big-exp-row:last-child{border-bottom:none}
  .big-exp-row .be-ops{margin-left:auto;display:flex;gap:2px}
  .be-rank{width:20px;height:20px;border-radius:6px;background:var(--red-soft);color:var(--red);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

  /* 财务 · 储蓄小荷包 */
  .sg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:14px}
  .sg-card{padding:16px}
  .sg-head{display:flex;align-items:flex-start;gap:10px}
  .sg-emoji{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--brand-soft);flex:0 0 auto}
  .sg-name{font-size:14.5px;font-weight:700;line-height:1.35}
  .sg-purpose{font-size:11px;color:var(--text-3);margin-top:2px}
  .sg-amount{font-size:25px;font-weight:800;color:var(--brand);line-height:1.2;margin-top:12px}
  .sg-amount small{font-size:12px;font-weight:600;color:var(--text-3);margin-left:4px}
  .sg-bar{height:9px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin:8px 0 4px}
  .sg-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#9aa1ff)}
  .sg-bar.done i{background:linear-gradient(90deg,#16a34a,#4ade80)}
  .sg-sub{font-size:11.5px;color:var(--text-3);line-height:1.6}
  .sg-ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .sg-entries{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
  .sg-entry{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2);padding:3px 0}
  .sg-entry .se-ops{margin-left:auto}
  .sg-spark{margin-top:8px}
  .goal-mode-box{background:var(--gray-soft);border-radius:10px;padding:12px;margin-bottom:14px}
  .wb-chip-pick{display:flex;gap:6px;flex-wrap:wrap}

  /* 时间轴 */
  .wb-guide{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--brand-soft);border:1px solid #e0e4ff;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12px;line-height:1.7;color:var(--text-2)}
  .wb-guide b{color:var(--brand-dark)}
  .wb-guide ol{margin:4px 0 0;padding-left:18px}
  .sched-quick .select{width:auto;flex:0 0 112px;padding:10px 8px}
  .sched-presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11.5px;color:var(--text-3)}
  .sched-presets .chip{font-size:11.5px;padding:5px 11px}
  .sched-datestrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px}
  .sched-datestrip .chip{flex:0 0 auto;font-size:11px;padding:5px 10px}
  .sched-daybar{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .sdb-title{font-size:12.5px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .sdb-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-bottom:3px}
  .sdb-track{position:relative;background:var(--gray-soft);border-radius:8px;width:100%}

  .sched-catbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--gray-soft);margin:8px 0}

  .scb-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--text-2)}
  .scb-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
  .tl-pomo{font-size:11px;color:var(--red);background:var(--red-soft);border-radius:6px;padding:1px 6px;font-weight:600}

  /* 番茄钟 */

  .pomo-goalbar .pg-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:6px}
  .pomo-link{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--brand-soft);color:var(--brand-dark);border-radius:99px;padding:4px 11px;margin-top:10px}

  /* 示例数据预览模式 */

  /* ===== 阅读观影：总览可视化 + 分类 → 条目独立支路 ===== */
  .mn-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;position:sticky;top:0;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}

  .mn-nav .sep{width:1px;height:20px;background:var(--border);margin:0 2px;flex:0 0 auto}
  .mn-nav .chip{flex:0 0 auto;white-space:nowrap}
  .mn-nav .chip .n{font-size:10px;opacity:.75;margin-left:3px;font-weight:700}
  .mn-nav .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .mn-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .mn-kpi{padding:15px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .mn-kpi b{display:block;font-size:25px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
  .mn-kpi span{display:block;font-size:11.5px;color:var(--text-2);margin-top:4px;font-weight:600}
  .mn-kpi small{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}
  .mn-panels{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-bottom:14px}
  .mn-panel{padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
  .mn-panel h4{font-size:14px;font-weight:700;margin-bottom:3px}
  .mn-panel .mn-sub{font-size:11.5px;color:var(--text-3);margin-bottom:12px}
  .mn-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .mn-block{padding:16px;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .mn-donut-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .mn-donut{flex:0 0 150px;max-width:150px}
  .mn-legend{flex:1 1 130px;display:flex;flex-direction:column;gap:9px;min-width:120px}
  .mn-legend-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .mn-legend-row i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .mn-legend-row b{margin-left:auto;font-variant-numeric:tabular-nums}
  .mn-legend-row span{color:var(--text-2)}
  .mn-rate{display:flex;flex-direction:column;gap:8px}
  .mn-rate-line{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-2)}
  .mn-rate-line .rl{width:38px;flex:0 0 auto;white-space:nowrap}
  .mn-rate-line .rb{flex:1;height:9px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
  .mn-rate-line .rb i{display:block;height:100%;border-radius:99px}
  .mn-rate-line .rv{width:26px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--text-3)}
  .mn-feed{display:flex;flex-direction:column;gap:0}
  .mn-feed-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px;align-items:flex-start}
  .mn-feed-row:last-child{border-bottom:0}
  .mn-feed-row .fd{color:var(--text-3);font-size:11px;flex:0 0 46px;font-variant-numeric:tabular-nums}
  .mn-feed-row .fk{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px}
  .mn-feed-row .ft{min-width:0;flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mn-feed-row .fi{color:var(--text);font-weight:600}
  .mn-sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 10px;font-size:14px;font-weight:700}
  .mn-sec-t span{font-size:11.5px;color:var(--text-3);font-weight:500}
  .mn-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .mn-item{padding:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.15s;position:relative;min-width:0}
  .mn-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
  .mn-item .mi-bar{height:4px;width:100%}
  .mn-item .mi-body{padding:14px 15px 15px}
  .mn-item .mi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .mn-item .mi-title{font-size:15px;font-weight:700;line-height:1.35;word-break:break-word}
  .mn-item .mi-creator{font-size:11.5px;color:var(--text-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mn-item .mi-summary{font-size:12px;color:var(--text-2);margin-top:9px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
  .mn-item .mi-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:11px}
  .mn-item .mi-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--text-3)}
  .mn-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .mn-stars{font-size:12px;color:#f59e0b;letter-spacing:1px;white-space:nowrap}
  .mn-stars .off{color:#dfe2e8}
  .mn-progress{height:7px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:10px}
  .mn-progress i{display:block;height:100%;border-radius:99px}
  .mn-progress-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin-top:5px}
  .mn-detail-head{padding:18px 20px;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);border-top:4px solid var(--brand)}
  .mn-dh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .mn-dh-title{font-size:21px;font-weight:800;line-height:1.35}
  .mn-dh-creator{font-size:12.5px;color:var(--text-2);margin-top:4px}

  .mn-dh-meta .m{font-size:11.5px;color:var(--text-2);background:var(--gray-soft);border-radius:8px;padding:5px 10px}
  .mn-dh-meta .m b{color:var(--text);font-weight:700}
  .mn-dh-summary{margin-top:14px;padding:11px 13px;border-radius:10px;background:var(--gray-soft);font-size:13px;line-height:1.7;color:var(--text-2)}

  .mn-dh-ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .mn-branch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .mn-bstat{padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px}
  .mn-bstat b{display:block;font-size:19px;font-weight:800}
  .mn-bstat span{font-size:11px;color:var(--text-2)}
  .mn-branch-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .mn-branch-nav .lead{font-size:11.5px;font-weight:700;color:var(--text-3);margin-right:2px}
  .mn-timeline{position:relative;padding-left:22px}
  .mn-timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#dcdfe6}
  .mn-entry{position:relative;margin-bottom:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
  .mn-entry:before{content:"";position:absolute;left:-20px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--mn-branch,var(--brand))}
  .mn-entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .mn-entry-head .ed{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .mn-entry-head .el{font-size:11px;color:var(--text-2);background:var(--gray-soft);border-radius:6px;padding:1px 7px}

  .mn-tip{font-size:11.5px;color:var(--text-3);line-height:1.7;margin-top:12px;padding:9px 12px;background:var(--gray-soft);border-radius:9px}
  @media(max-width:900px){ .mn-panels{grid-template-columns:1fr} .mn-cards{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:600px){

    .mn-cards{grid-template-columns:1fr}

    .mn-nav{top:0;padding:9px 10px}

  /* ===== 阅读观影：检索页 / 分类支路条 ===== */
  .mn-cat-add{border-style:dashed;color:var(--text-2)}

  .mn-branch-bar{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:9px 12px;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);scrollbar-width:thin}
  .mn-branch-bar .lead{font-size:11.5px;font-weight:700;color:var(--text-3);flex:0 0 auto;white-space:nowrap}
  .mn-branch-bar .chip{flex:0 0 auto;white-space:nowrap}
  .ms-panel{padding:16px 18px;margin-bottom:14px}

  .ms-group .chip{padding:5px 11px;font-size:12px}

  .ms-col{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
  .ms-col-t{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}

  .ms-item-s{font-size:11.5px;color:var(--text-2);margin-top:5px;line-height:1.6}
  .ms-item-n{font-size:11px;color:var(--text-3);flex:0 0 auto;white-space:nowrap}

<script>
/* ================= 云服务与状态 ================= */
const LS_KEY = 'workbench_v1';              // 旧版 localStorage 数据键（迁移用）
const LS_LOCAL_KEY = 'workbench_v1_local';  // 本地兜底备份键
/* 独立版：未配置云端服务，纯本地存储（localStorage）。
   如需多设备同步，请参考 README 接入你自己的后端，并在此填写配置。 */
const CLOUD_CONFIG = {
  endpoint: '',
  oauthRelayBaseUrl: '',
  publishableKey: '',
};
let cloud = null;
let stateRowId = null;   // 云端 workbench_state 行的 id
let cloudReady = false;  // 云端状态确认读取成功后才允许写入，避免空数据覆盖完整数据
let currentUser = null;  // 当前登录用户
let offlineMode = false; // 离线模式（域名故障等场景下的临时本地使用）

function emptyState(){ return { plans:[],moods:[],side:[],finance:[],timers:[],ideas:[],pomodoros:[],sites:[],routines:[],schedule:[],warehouse:[],relations:[],memos:[],sops:[],todoMoves:[],quotes:[],scheduleMemo:{},bigExpenses:[],savingsGoals:[],media:[],mediaCats:[],mediaHiddenCats:[] }; }
let state = emptyState();

function readLocalState(){
  try{ const r=localStorage.getItem(LS_LOCAL_KEY); if(r) return JSON.parse(r); }catch(e){}
  try{ const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r); }catch(e){}
  return null;
}
function writeLocalBackup(){ try{ localStorage.setItem(LS_LOCAL_KEY, JSON.stringify(state)); }catch(e){} }

// save() 保持同步调用：写本地兜底 + 防抖推送云端
function save(){
  if(demoMode) return;   // 预览模式：不写本地备份、不推云端，真实数据零风险
  writeLocalBackup();
  scheduleCloudPersist();
}
let saveTimer=null;
function scheduleCloudPersist(){ clearTimeout(saveTimer); saveTimer=setTimeout(persistCloudNow,500); }
/* 云端状态：一个账号只允许一行。
   历史上重复行的成因：stateRowId 只在内存里，刷新即丢失；只要某次读取失败，
   下一次 save() 就走 insert 又新增一行。现在读取/写入都先查真实存在的行，
   并永远选取「内容最完整、其次最新」的那一行，绝不再盲目 insert。 */
function cloudDataSize(d){ try{ return d?JSON.stringify(d).length:0; }catch(e){ return 0; } }
function cloudPickRow(rows){
  const list=Array.isArray(rows)?rows.filter(Boolean):(rows?[rows]:[]);
  list.sort((a,b)=>cloudDataSize(b.data)-cloudDataSize(a.data)||String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
  return list[0]||null;
}
async function cloudExistingRows(){
  const { data, error } = await cloud.database.from('workbench_state').select('id, data, updated_at');
  if(error) throw error;   // 查不清就不写，避免制造重复行
  return cloudPickRow(data);
}
async function persistCloudNow(){
  if(demoMode) return;   // 页面隐藏 / 离开时的兜底推送也必须拦住
  if(!cloud || !currentUser) return;
  if(!cloudReady){ console.warn('[cloud save] 跳过：云端状态尚未成功读取，避免空数据覆盖'); return; }
  try{
    let rowId=stateRowId;
    if(!rowId){
      const existing=await cloudExistingRows();
      rowId=existing?existing.id:null;
      if(rowId) stateRowId=rowId;
    }
    if(rowId){
      const r=await cloud.database.from('workbench_state').update({ data: state }).eq('id', rowId);
      if(r&&r.error) throw r.error;
    }else{
      const r=await cloud.database.from('workbench_state').insert({ data: state }).select();
      if(r.error) throw r.error;
      if(r.data&&r.data[0]) stateRowId=r.data[0].id;
    }
  }catch(e){ console.error('[cloud save]', e && e.message ? e.message : e); }
}
async function loadCloudState(){
  /* 不用 maybeSingle()：SDK 在结果多于 1 行时会返回 406/PGRST116 直接报错 */
  const row=await cloudExistingRows();
  if(!row){ stateRowId=null; return null; }
  stateRowId=row.id;
  let d=row.data;
  if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){ d=null; } }
  return (d&&typeof d==='object')?d:null;
}
// 页面离开/隐藏时尽力刷一次云端，避免最后一次编辑因快速关闭而丢失
window.addEventListener('pagehide', ()=>{ persistCloudNow(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') persistCloudNow(); });

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
function pad(n){ return String(n).padStart(2,'0'); }
function dstr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function today(){ return dstr(new Date()); }
function thisMonth(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); return `${d.getMonth()+1}月${d.getDate()}日`; }
function fmtMonth(s){ if(!s) return '—'; const [y,m]=s.split('-'); return `${y}年${Number(m)}月`; }
// 兼容「月」与「日」两种粒度的记录日期：YYYY-MM 显示年月，YYYY-MM-DD 显示月日
function fmtPeriod(s){ if(!s) return '—'; return (String(s).length<=7)?fmtMonth(s):fmtDate(s); }
function periodLabel(s){ if(!s) return ''; if(String(s).length<=7){ const [y,m]=s.split('-'); return `${y}/${m}`; } const d=new Date(s+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; }
function toDateValue(s){ if(!s) return today(); s=String(s); if(s.length>=10) return s.slice(0,10); return s+'-01'; }
function fmtMoney(n){ n=Number(n)||0; if(Math.abs(n)>=10000) return (n/10000).toFixed(n%10000===0?0:1)+'万'; return String(Math.round(n)); }
function weekMonday(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); d.setHours(0,0,0,0); return d; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function greeting(){ const d=new Date(), h=d.getHours(), m=d.getMinutes(); if(h<6||h>=23||(h===22&&m>=30))return'很晚了'; if(h<9)return'早上好'; if(h<12)return'上午好'; if(h<14)return'中午好'; if(h<18)return'下午好'; return'晚上好'; }
/* 首页顶部：按时间与待办完成程度换一句贴合当下的话，而不是永远「继续加油」 */
function heroTone(n,done){
  const d=new Date(), h=d.getHours(), mi=d.getMinutes();
  const late=(h<6||h>=23||(h===22&&mi>=30));
  const allDone=n>0&&done>=n;
  const line=tail=>n?`今天有 <b>${n}</b> 件待办，已完成 <b>${done}</b> 件 · ${tail}`:'今天没有安排，给自己留点空白';
  const day=fmtDate(today());
  if(late) return {eyebrow:day+' · 夜深了',title:'很晚了，好好休息',spark:'☾',
    sub:allDone?'今天的事都做完了，安心睡吧':(n?line('剩下的明天再说'):'今天没有安排，早点休息')};
  if(h<9) return {eyebrow:day+' · 新的一天',title:'早上好，慢慢开始',spark:'✦',
    sub:allDone?'今天的事都做完了，真好':(n?line('从容一点，来得及'):'今天还很空，先照顾好自己')};
  if(h<12) return {eyebrow:day+' · 上午',title:'上午好，继续加油',spark:'✦',

function loadNavOrder(){

    if(Array.isArray(v)){
      const set=new Set(all);
      const kept=v.filter(x=>set.has(x));
      const missing=all.filter(x=>!kept.includes(x));
      if(kept.length===all.length) return kept;
      if(kept.length) return kept.concat(missing);   // 新增的导航项追加到末尾，不重置用户顺序
    }
  }catch(e){}
  return all;
}

/* ================= 首页仪表盘（日历 + 今日待办） ================= */
// 判断某例行事项在指定日期是否该做（用于日历与待办聚合）
function routineDueOn(r, dateStr){
  const d=new Date(dateStr+'T00:00:00');
  if(r.freq==='daily') return true;
  if(r.freq==='weekly') return (r.weekdays||[]).map(Number).includes(d.getDay());
  if(r.freq==='monthly'){
    if(r.monthDay==='end'){ const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()===last; }
    return d.getDate()===Number(r.monthDay);
  }
  return false;
}
// 判断某倒计时事项是否落在指定公历日期（阳历/每年重复/阴历生日均支持）
function timerOnDate(t, y, m, d){
  if(!t || t.type!=='countdown') return false;
  const ds=`${y}-${pad(m)}-${pad(d)}`;
  if(t.calendar==='lunar'){
    const lu=solarToLunar(new Date(y,m-1,d));
    if(!lu) return false;
    if(lu.month!==Number(t.lunarMonth)||lu.day!==Number(t.lunarDay)) return false;
    if(t.lunarLeap && !lu.isLeap) return false;
    return true;
  }
  if(t.repeat){
    const p=(t.date||'').split('-').map(Number);
    return p[1]===m && p[2]===d;
  }
  return t.date===ds;
}
// 日历上需要打点的事件日期（计划截止 / 心情 / 财务精确到日）
function calEventDates(){
  const set=new Set();
  state.plans.forEach(p=>{ if(p.deadline) set.add(p.deadline); });
  state.moods.forEach(m=>{ if(m.date) set.add(m.date); });
  state.finance.forEach(f=>{ const s=String(f.month||''); if(s.length>=10) set.add(s.slice(0,10)); });
  return set;
}
// 指定年月的倒计时日期集合（用于日历打点）；y 为公历年、m 为 1-based 月份，与 renderCalendar 的日期字符串一致
function calTimerDates(y,m){
  const set=new Set();
  const days=new Date(y,m,0).getDate();
  (state.timers||[]).forEach(t=>{
    if(t.type!=='countdown') return;
    for(let d=1;d<=days;d++){ if(timerOnDate(t,y,m,d)) set.add(`${y}-${pad(m)}-${pad(d)}`); }
  });
  return set;
}
// 聚合某日期的待办清单（例行事项 + 当日截止的计划 + 当天倒计时提醒）
function collectDayTodos(dateStr){
  const items=[];
  (state.routines||[]).forEach(r=>{
    if((r.skipDates||[]).includes(dateStr)) return;   // 当天已顺延的例行，不再重复出现
    if(routineDueOn(r,dateStr)) items.push({type:'routine',key:'routine:'+r.id,id:r.id,name:r.name,done:routineDoneOn(r,dateStr),tag:'例行',tagBg:'var(--blue-soft)',tagFg:'var(--blue)',sub:routineFreqLabel(r)});
  });
  state.plans.forEach(p=>{
    if(p.deadline===dateStr && p.status!=='已完成' && p.status!=='已放弃'){
      items.push({type:'plan',key:'plan:'+p.id,id:p.id,name:p.title,done:false,tag:'计划',tagBg:'var(--brand-soft)',tagFg:'var(--brand)',sub:'今日截止',moveCount:Number(p.moveCount)||0});
    }
  });
  (state.memos||[]).forEach(m=>{
    if(m.date!==dateStr) return;
    items.push({type:'memo',key:'memo:'+m.id,id:m.id,name:m.text,done:!!m.done,tag:'备忘',tagBg:'var(--purple-soft)',tagFg:'var(--purple)',sub:'',moveCount:Number(m.moveCount)||0});
  });
  (state.timers||[]).forEach(t=>{
    if(t.type!=='countdown') return;
    const p=(dateStr||'').split('-').map(Number);
    if(!timerOnDate(t,p[0],p[1],p[2])) return;
    const left=timerDays(t);
    const past=left<0;
    items.push({type:'timer',key:'timer:'+t.id,id:t.id,name:t.name,done:false,tag:'倒计时',tagBg:'var(--red-soft)',tagFg:'var(--red)',sub:past?`已过去 ${Math.abs(left)} 天`:left===0?'就是今天':`还有 ${left} 天`,checkable:false});
  });
  return items;
}

/* 待办顺延到次日：只改日期 / 截止日，并追加一条顺延流水，原有记录字段全部保留 */
function nextDayStr(ds){
  const d=new Date((ds||today())+'T00:00:00');
  if(isNaN(d)) return today();
  d.setDate(d.getDate()+1);
  return dstr(d);
}
function moveTodoToNextDay(type,id,from){
  from=from||today();
  const to=nextDayStr(from);
  let name='';
  if(type==='memo'){
    const m=(state.memos||[]).find(x=>x.id===id); if(!m) return;
    name=m.text; m.date=to; m.movedFrom=from; m.moveCount=(Number(m.moveCount)||0)+1;
  }else if(type==='plan'){
    const p=(state.plans||[]).find(x=>x.id===id); if(!p) return;
    name=p.title; p.deadline=to; p.movedFrom=from; p.moveCount=(Number(p.moveCount)||0)+1;
  }else if(type==='routine'){
    const r=(state.routines||[]).find(x=>x.id===id); if(!r) return;
    name=r.name;
    r.skipDates=Array.isArray(r.skipDates)?r.skipDates:[];
    if(!r.skipDates.includes(from)) r.skipDates.push(from);   // 只在当天清单里跳过，不破坏循环规则
    state.memos=state.memos||[];
    state.memos.push({ id:uid(), date:to, text:name, done:false, createdAt:new Date().toISOString(), movedFrom:from, fromRoutine:true, moveCount:1 });
  }else return;
  state.todoMoves=state.todoMoves||[];
  state.todoMoves.push({ id:uid(), type, name, from, to, at:new Date().toISOString() });
  save(); render();
  toast(`已挪到 ${fmtDate(to)} 的待办清单`);
}

/* 首页待办清单：手动拖动排序（顺序存 localStorage，跨日期生效；未排过序的新事项追加在末尾） */
const TODO_ORDER_KEY='workbench_todo_order';
let todoOrder=(()=>{ try{ const v=JSON.parse(localStorage.getItem(TODO_ORDER_KEY)); if(Array.isArray(v)) return v; }catch(e){} return []; })();
function saveTodoOrder(){ if(demoMode) return; try{ localStorage.setItem(TODO_ORDER_KEY,JSON.stringify(todoOrder)); }catch(e){} }
function applyTodoOrder(items){
  const idx=new Map(todoOrder.map((k,i)=>[k,i]));
  return items.slice().sort((a,b)=>{
    const ia=idx.has(a.key)?idx.get(a.key):Number.MAX_SAFE_INTEGER;
    const ib=idx.has(b.key)?idx.get(b.key):Number.MAX_SAFE_INTEGER;
    return ia-ib;   // Array.prototype.sort 稳定排序，未排序项保持默认相对顺序
  });
}

function renderCalendar(){
  const now=new Date();
  const y=calViewY!=null?calViewY:now.getFullYear();
  const m=calViewM!=null?calViewM:now.getMonth();
  const firstDow=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const tstr=today();
  const ev=calEventDates();
  const tms=calTimerDates(y,m+1);
  const week=['日','一','二','三','四','五','六'];
  let cells='';
  for(let i=firstDow-1;i>=0;i--){ cells+=`<div class="cal-day other">${prevDays-i}</div>`; }
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const cls=['cal-day'];
    if(ds===tstr) cls.push('today');
    if(ds===calSelDate) cls.push('sel');
    if(tms.has(ds)) cls.push('has-timer');
    else if(ev.has(ds)) cls.push('has-event');
    cells+=`<div class="${cls.join(' ')}" data-action="cal-pick" data-date="${ds}">${d}</div>`;
  }
  const total=firstDow+days, tail=(7-total%7)%7;
  for(let i=1;i<=tail;i++){ cells+=`<div class="cal-day other">${i}</div>`; }
  return `<div class="card cal-card">
    <div class="cal-head">
      <div class="cal-title">${y}年${m+1}月</div>
      <div class="cal-nav">
        <button class="btn-icon" data-action="cal-prev" title="上个月"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

        <button class="btn-icon" data-action="cal-next" title="下个月"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="cal-week">${week.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span><i style="background:var(--brand)"></i>今天</span><span><i style="background:var(--red)"></i>倒计时</span><span><i style="background:var(--orange)"></i>有安排</span></div>
  </div>`;
}

function quoteList(){ return (state.quotes||[]).filter(q=>q&&String(q.text||'').trim()); }
function dayHash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function todayQuoteIndex(){ const n=quoteList().length; return n?dayHash(today())%n:0; }
function currentQuoteIndex(){ const n=quoteList().length; return n?(((todayQuoteIndex()+quoteSlideIdx)%n)+n)%n:0; }
function quoteAt(i){ const l=quoteList(); return l.length?l[((i%l.length)+l.length)%l.length]:null; }

// 首页：最近的两个时间记录（优先倒计时，不足时用正计时补齐），点卡片去时间记录页
function dashTimersHTML(){
  const all=(state.timers||[]).filter(t=>t&&t.date);
  if(!all.length) return '';
  const cd=all.filter(t=>t.type==='countdown').map(t=>({t,d:Number(timerDays(t))||0}))
    .sort((a,b)=>((a.d>=0?a.d:Math.abs(a.d)+10000)-(b.d>=0?b.d:Math.abs(b.d)+10000)));
  const up=all.filter(t=>t.type!=='countdown').map(t=>({t,d:Number(timerDays(t))||0})).sort((a,b)=>b.d-a.d);
  const list=cd.slice(0,2);
  if(list.length<2) list.push(...up.slice(0,2-list.length));
  if(!list.length) return '';
  const cards=list.map(({t,d})=>{
    const isCD=t.type==='countdown', urgent=isCD&&d>=0&&d<=7;
    let pre,num;
    if(isCD){
      if(d<0){ pre=''; num='已到期'; }
      else if(d===0){ pre=''; num='就是今天'; }
      else{ pre='还有'; num=d+' 天'; }
    }else{ pre='已经'; num=d+' 天'; }
    let dl;
    if(isCD){
      if(t.calendar==='lunar') dl='农历 '+lunarLabel(t);
      else if(t.repeat){ const nx=nextOccurrence(t.date); dl=(nx.getMonth()+1)+'月'+nx.getDate()+'日'; }
      else dl=t.date;
    }else dl='自 '+t.date;
    return `<div class="dash-timer ${urgent?'urgent':''}" data-action="nav" data-view="timers">
      <div class="dt-top"><span class="dt-cat">${esc(t.category||'日子')}</span><span class="dt-date">${esc(dl)}</span></div>
      <div class="dt-name">${esc(t.name||'未命名')}</div>
      <div class="dt-num"><small>${pre}</small><b>${num}</b></div></div>`;
  }).join('');
  return `<div class="dash-timers"><div class="dt-head"><span>值得记住的日子</span>
    <button class="btn btn-ghost btn-sm" data-action="nav" data-view="timers">全部 →</button></div>
    <div class="dt-grid">${cards}</div></div>`;
}

// 首页：近 7 天复盘（趋势可视化 + 关键指标 + 一键导出）
function last7Days(){
  const out=[], now=new Date();
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); out.push(dstr(d)); }
  return out;
}
function dashReview(){
  const days=last7Days();
  const labels=days.map(d=>{ const x=new Date(d+'T00:00:00'); return (x.getMonth()+1)+'/'+x.getDate(); });
  const focusVals=days.map(d=>(state.pomodoros||[]).filter(p=>p.date===d).reduce((s,p)=>s+(p.minutes||0),0));
  const moodVals=days.map(d=>{ const ms=(state.moods||[]).filter(m=>m.date===d); return ms.length?+(ms.reduce((s,m)=>s+Number(m.score||0),0)/ms.length).toFixed(1):null; });
  const moodNums=moodVals.filter(v=>v!=null);
  const moodAvg=moodNums.length?(moodNums.reduce((s,v)=>s+v,0)/moodNums.length).toFixed(1):'—';

  const plans=state.plans||[];
  const planDone=plans.filter(p=>p.status==='已完成').length;
  const planRate=plans.length?Math.round(planDone/plans.length*100):0;

  const routines=state.routines||[];
  let dueCount=0, doneCount=0;
  days.forEach(d=>{ routines.forEach(r=>{ if(routineDueOnDate(r,d)){ dueCount++; if(routineDoneOn(r,d)) doneCount++; } }); });
  const routineRate=dueCount?Math.round(doneCount/dueCount*100):0;

  const focusTotal=focusVals.reduce((s,v)=>s+v,0);
  const hasData=(state.moods.length+plans.length+routines.length+(state.pomodoros||[]).length)>0;

  const chart=lineChartSVG([{name:'专注分钟',color:'#4f5ef7',data:focusVals}],labels,{compact:true});
  const stat=(k,v,sub)=>`<div class="rv-stat"><div class="rv-k">${k}</div><div class="rv-v">${v}</div><div class="rv-sub">${sub}</div></div>`;

  return `<div class="card dash-review" style="margin-top:14px">

        ${stat('专注时长', focusTotal?fmtDuration(focusTotal):'0 分', '近 7 天番茄累计')}

// 导出「近 7 天复盘」Word 文档（聚焦复盘，区别于全量导出）
function exportReview(){
  const E=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const days=last7Days();
  const labels=days.map(d=>{ const x=new Date(d+'T00:00:00'); return (x.getMonth()+1)+'/'+x.getDate(); });
  const focusVals=days.map(d=>(state.pomodoros||[]).filter(p=>p.date===d).reduce((s,p)=>s+(p.minutes||0),0));
  const moodVals=days.map(d=>{ const ms=(state.moods||[]).filter(m=>m.date===d); return ms.length?+(ms.reduce((s,m)=>s+Number(m.score||0),0)/ms.length).toFixed(1):null; });
  const moodNums=moodVals.filter(v=>v!=null);
  const moodAvg=moodNums.length?(moodNums.reduce((s,v)=>s+v,0)/moodNums.length).toFixed(1):'—';
  const plans=state.plans||[];
  const planDone=plans.filter(p=>p.status==='已完成').length;
  const planRate=plans.length?Math.round(planDone/plans.length*100):0;
  const routines=state.routines||[];
  let dueCount=0, doneCount=0;
  days.forEach(d=>{ routines.forEach(r=>{ if(routineDueOnDate(r,d)){ dueCount++; if(routineDoneOn(r,d)) doneCount++; } }); });
  const routineRate=dueCount?Math.round(doneCount/dueCount*100):0;
  const focusTotal=focusVals.reduce((s,v)=>s+v,0);
  const from=days[0], to=days[days.length-1];
  const now=new Date().toLocaleString('zh-CN');

  const dayRows=days.map((d,i)=>`<tr><td>${E(d)}</td><td>${focusVals[i]?E(fmtDuration(focusVals[i])):E(focusVals[i]+' 分')}</td><td>${moodVals[i]!=null?E(moodVals[i]):'—'}</td></tr>`).join('');
  let o='';
  o+=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>近7天复盘</title></head><body>`;
  o+=`<h1 style="text-align:center">近 7 天复盘</h1><p style="text-align:center;color:#888">统计区间：${E(from)} ~ ${E(to)} · 导出时间：${now}</p>`;
  o+=`<h2>一、关键指标</h2><table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;width:100%">`
    +`<tr><td>平均心境</td><td>${moodAvg} / 10（${moodNums.length} 天有记录）</td></tr>`
    +`<tr><td>计划完成率</td><td>${planRate}%（${planDone}/${plans.length} 已完成）</td></tr>`
    +`<tr><td>例行打卡率</td><td>${routineRate}%（${dueCount?doneCount+'/'+dueCount+' 次应打卡':'暂未设置例行事项'}）</td></tr>`
    +`<tr><td>专注时长</td><td>${focusTotal?fmtDuration(focusTotal):'0 分'}（近 7 天番茄累计）</td></tr></table>`;
  o+=`<h2>二、每日明细</h2><table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse;width:100%"><tr><th>日期</th><th>专注时长</th><th>心境评分</th></tr>${dayRows}</table>`;
  o+=`<p style="margin-top:16px;color:#888;font-size:12px">提示：如需全部模块的历史数据，请使用顶部「导出 Word 文档」。</p>`;
  o+=`</body></html>`;
  const blob=new Blob(['\ufeff'+o],{type:'application/msword'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`近7天复盘-${today()}.doc`; a.click(); URL.revokeObjectURL(a.href);
  toast('近 7 天复盘已导出');
}

  return `<div class="cat-pick" id="${inputId}">`+cats.map(c=>`<button type="button" class="chip ${current===c.key?'active':''}" data-cat="${c.key}" onclick="pickCat('${action}','${inputId}','${c.key}')" ${current===c.key?`style="background:${c.color};border-color:${c.color};color:#fff"`:`style="border-color:${c.color};color:${c.color}"`}>${c.label}</button>`).join('')+`</div><input type="hidden" name="cat" id="${inputId}Input" value="${esc(current||'other')}">`;
}
function pickCat(action, pickId, key){
  const inp=$(`#${pickId}Input`); if(inp) inp.value=key;
  document.querySelectorAll(`#${pickId} .chip`).forEach(b=>{
    const sel=b.dataset.cat===key, c=PLAN_CATS.concat(ROUTINE_CATS,SOP_CATS).find(x=>x.key===b.dataset.cat)||{color:'#9aa0ac'};
    b.classList.toggle('active',sel);
    b.style.background=sel?c.color:'';
    b.style.borderColor=c.color;
    b.style.color=sel?'#fff':c.color;
  });
}

/* ================= 计划与复盘 · 看板 =================
   结构：① 全部计划可视化总览（页首，可折叠）
         ② 并列周期标签：短期 / 中期 / 长期
         ③ 短期=紧凑清单；中/长期再开一层「按计划查看」，记录阶段性（日）复盘
   数据层完全沿用 state.plans[] / p.reviews[]，不迁移、不覆盖任何旧字段；
   新写的复盘额外带一个可选 progress 快照，用于画阶段进度曲线，旧复盘没有也能正常显示。 */
const TIER_COLORS={短:'#2563eb',中:'#7c3aed',长:'#f59e0b'};
const TIER_SOFT={短:'#eaf1fe',中:'#f3edff',长:'#fef3e0'};
const PLAN_ST_COLOR={'未开始':'#9aa0ac','进行中':'#2563eb','已完成':'#16a34a','已放弃':'#dc2626'};
const ICO_EDIT='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg>';
const ICO_DEL='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';
const ICO_CHECK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICO_PEN='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICO_COPY='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';

function normTier(p){ const t=String((p&&p.tier)||'短').replace('期',''); return ['短','中','长'].includes(t)?t:'短'; }
function planReviews(p){ return (p&&Array.isArray(p.reviews))?p.reviews:[]; }
function planAllReviews(){
  const out=[];
  (state.plans||[]).forEach(p=>planReviews(p).forEach(r=>{
    if(r&&r.date) out.push(Object.assign({},r,{planId:p.id,planTitle:p.title,planTier:normTier(p)}));
  }));
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function daysUntil(s){
  if(!s||!/^\d{4}-\d{2}-\d{2}/.test(String(s))) return null;
  const a=new Date(String(s).slice(0,10)+'T00:00:00'), b=new Date(today()+'T00:00:00');
  return isNaN(a)?null:Math.round((a-b)/86400000);
}
function lastReviewGap(p){
  const ds=planReviews(p).map(r=>r.date).filter(Boolean).sort();
  if(!ds.length) return null;
  const g=daysUntil(ds[ds.length-1]);
  return g==null?null:Math.max(0,-g);
}

/* ---------- ① 全部计划可视化总览 ---------- */
function planOverviewHTML(){
  const plans=state.plans||[], total=plans.length;
  const done=plans.filter(p=>p.status==='已完成').length;
  const active=plans.filter(p=>p.status==='进行中').length;
  const rate=total?Math.round(done/total*100):0;
  const reviews=planAllReviews();
  const since=new Date(today()+'T00:00:00'); since.setDate(since.getDate()-6);
  const recent=reviews.filter(r=>{ const d=new Date(String(r.date).slice(0,10)+'T00:00:00'); return !isNaN(d)&&d>=since; }).length;
  const head=`<div class="pb-ov-head"><h3>全部计划 · 可视化总览 <span class="pb-hint">共 ${total} 项计划 · ${reviews.length} 条复盘</span></h3>
    <button class="btn btn-ghost btn-sm" data-action="pb-overview-toggle">${planOverviewOpen?'收起总览':'展开总览'}</button></div>`;
  if(!planOverviewOpen) return `<div class="card pb-overview">${head}</div>`;

  const kpi=(v,label,color)=>`<div class="pb-kpi"><b${color?' style="color:'+color+'"':''}>${v}</b><span>${label}</span></div>`;
  const kpis=kpi(total,'全部计划')+kpi(active,'进行中','var(--blue)')+kpi(done,'已完成','var(--green)')+kpi(rate+'%','完成率')+kpi(reviews.length,'累计复盘','var(--purple)')+kpi(recent,'近 7 天复盘','var(--orange)');

  const tierCards=['短','中','长'].map(t=>{
    const arr=plans.filter(p=>normTier(p)===t);
    const avg=arr.length?Math.round(arr.reduce((s,p)=>s+(Number(p.progress)||0),0)/arr.length):0;
    const rv=arr.reduce((s,p)=>s+planReviews(p).length,0);
    return `<button class="pb-tier-card ${planBoardTier===t?'sel':''}" data-action="pb-tier" data-tier="${t}">
      <div class="tc-top"><span class="tc-name">${TIER_LABEL[t]}</span><span class="tc-num" style="color:${TIER_COLORS[t]}">${arr.length}</span></div>
      <div class="tc-sub">平均进度 ${avg}% · ${rv} 条复盘</div>
      <div class="pb-mini-bar"><i style="width:${avg}%;background:${TIER_COLORS[t]}"></i></div>
    </button>`;
  }).join('');

  const stKeys=['未开始','进行中','已完成','已放弃'];
  const stack=`<div class="pb-stack">${stKeys.map(k=>{
    const n=plans.filter(p=>p.status===k).length;
    return n?`<i style="width:${n/total*100}%;background:${PLAN_ST_COLOR[k]}" title="${k} ${n} 项"></i>`:'';
  }).join('')}</div><div class="pb-legend">${stKeys.map(k=>`<span><em style="background:${PLAN_ST_COLOR[k]}"></em>${k} ${plans.filter(p=>p.status===k).length}</span>`).join('')}</div>`;

  const catRows=PLAN_CATS.map(c=>({c,n:plans.filter(p=>p.cat===c.key).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const catHtml=catRows.length?catRows.map(x=>`<div class="pb-dist-row"><span class="lab">${x.c.label}</span><div class="bar"><i style="width:${x.n/total*100}%;background:${x.c.color}"></i></div><span class="cnt">${x.n}</span></div>`).join(''):'<div style="font-size:11.5px;color:var(--text-3)">暂无分类数据</div>';

  const progBuckets=[['0%',0,0],['1–25%',1,25],['26–50%',26,50],['51–75%',51,75],['76–99%',76,99],['100%',100,100]];
  const progColors=['#cbd0da','#93b4fb','#4f5ef7','#7c3aed','#f59e0b','#16a34a'];
  const progHtml=progBuckets.map((b,i)=>{
    const n=plans.filter(p=>{ const v=Number(p.progress)||0; return v>=b[1]&&v<=b[2]; }).length;
    return `<div class="pb-dist-row"><span class="lab" style="width:50px">${b[0]}</span><div class="bar"><i style="width:${n/total*100}%;background:${progColors[i]}"></i></div><span class="cnt">${n}</span></div>`;
  }).join('');

  const remind=[];
  plans.forEach(p=>{
    const tierName=TIER_LABEL[normTier(p)];
    if(p.status==='已完成'||p.status==='已放弃') return;
    const dl=daysUntil(p.deadline);
    if(dl!=null&&dl<=14) remind.push({id:p.id,cls:dl<0?'warn':'',tier:tierName,label:dl<0?`逾期 ${-dl} 天`:`${dl} 天后截止`,title:p.title});
    // 三个周期都能记阶段复盘，待复盘提醒统一只催「进行中」的计划
    if(p.status==='进行中'){
      const gap=lastReviewGap(p);
      if(gap==null) remind.push({id:p.id,cls:'',tier:tierName,label:'还没写过复盘',title:p.title});
      else if(gap>=7) remind.push({id:p.id,cls:'',tier:tierName,label:`${gap} 天没复盘`,title:p.title});
    }
  });
  const remindHtml=remind.length?`<div class="pb-reminds">${remind.slice(0,8).map(r=>`<button class="pb-remind ${r.cls}" data-action="pb-jump" data-id="${r.id}"><span style="opacity:.62">${r.tier}</span> <b>${esc(r.title)}</b> ${r.label} →</button>`).join('')}</div>`:'';

  const heat=`<div class="pb-heat"><div class="pb-heat-title">复盘热力图 <span>近 26 周 · 累计 ${reviews.length} 条 · 颜色越深，当天记录越多</span></div>
    ${updatesHeatmapSVG(reviews.map(r=>({date:String(r.date).slice(0,10),title:r.planTitle})),'#4f5ef7')}</div>`;

  return `<div class="card pb-overview">${head}
    <div class="pb-kpis">${kpis}</div>
    <div class="pb-tier-grid">${tierCards}</div>
    <div class="pb-ov-grid">
      <div><div class="pb-sec-t">按状态</div>${stack}<div class="pb-sec-t" style="margin-top:16px">按分类</div>${catHtml}</div>
      <div><div class="pb-sec-t">计划进度分布</div>${progHtml}
        <div style="font-size:11px;color:var(--text-3);margin-top:8px">点上方周期卡片或下方标签，直接切到对应计划清单</div>
      </div>
    </div>
    ${remindHtml}${heat}
  </div>`;
}

/* 阶段进度专用折线：纵轴固定 0–100%，不会被通用图的自动留白拉成负数 */
function planProgressChartSVG(pts,color){
  const W=640,H=170,padL=36,padR=14,padT=14,padB=26;
  const iw=W-padL-padR, ih=H-padT-padB;
  const x=i=>padL+(pts.length===1?iw/2:i*(iw/(pts.length-1)));
  const y=v=>padT+ih-(Math.max(0,Math.min(100,Number(v)||0))/100)*ih;
  let grid='';
  [0,25,50,75,100].forEach(v=>{
    grid+=`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="#eef0f4" stroke-width="1"/>`;
    grid+=`<text x="${padL-7}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9aa0ac">${v}</text>`;
  });
  const line=pts.map((r,i)=>`${x(i).toFixed(1)},${y(r.progress).toFixed(1)}`).join(' ');
  const area=`<polygon points="${padL},${y(0).toFixed(1)} ${line} ${x(pts.length-1).toFixed(1)},${y(0).toFixed(1)}" fill="${color}" opacity="0.09"/>`;
  const dots=pts.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r.progress).toFixed(1)}" r="3.6" fill="#fff" stroke="${color}" stroke-width="2"><title>${esc(periodLabel(r.date))}：${Number(r.progress)||0}%</title></circle>`).join('');
  const step=Math.ceil(pts.length/8);
  const labels=pts.map((r,i)=>(i%step===0||i===pts.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" fill="#9aa0ac">${esc(periodLabel(r.date))}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">${grid}${area}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>`;
}
function planFocusHTML(p){
  const c=planCat(p.cat), stCls=STATUS_CLASS[p.status]||'gray', prog=Number(p.progress)||0, color=c.color;
  const rs=planReviews(p).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const byLv=l=>rs.filter(r=>r.level===l).length;
  const gap=lastReviewGap(p), dl=daysUntil(p.deadline);
  const late=p.deadline&&dl!=null&&dl<0&&p.status!=='已完成'&&p.status!=='已放弃';

  const pts=rs.filter(r=>r.progress!=null&&r.date).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const chart=pts.length>=2
    ?`<div class="pb-chart-box"><div class="pb-sec-t">阶段进度曲线（${pts.length} 个复盘节点，纵轴 0–100%）</div>${planProgressChartSVG(pts,color)}</div>`
    :`<div class="pb-chart-box"><div style="font-size:11.5px;color:var(--text-3)">再记 ${Math.max(1,2-pts.length)} 笔带进度的阶段复盘，就会出现进度曲线；已有的老复盘不受影响。</div></div>`;

  const quick=`<form class="pb-quick" onsubmit="submitQuickReview(event,'${p.id}')">
    <h4>记一笔阶段复盘 <span style="font-weight:400;color:var(--text-3);font-size:11px">默认日复盘 · 保存时会同步更新计划进度</span></h4>
    <div class="qf-row">
      <input class="input" type="date" name="date" value="${today()}" style="width:145px">
      <select class="select" name="level" style="width:105px">${['日','周','月'].map(t=>`<option ${t==='日'?'selected':''}>${t}复盘</option>`).join('')}</select>
      <span style="font-size:11.5px;color:var(--text-2);font-weight:600">当时进度</span>
