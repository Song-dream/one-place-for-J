// 导航拖拽排序（HTML5 drag & drop，事件委托）
let dragView=null;
document.addEventListener('dragstart',e=>{
  const item=e.target.closest('.nav-item'); if(!item) return;
  dragView=item.dataset.view; item.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragView); }catch(err){}
});
document.addEventListener('dragover',e=>{
  const item=e.target.closest('.nav-item'); if(!item||!dragView) return;
  e.preventDefault();
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('drag-over'));
  if(item.dataset.view!==dragView) item.classList.add('drag-over');
});
document.addEventListener('drop',e=>{
  const item=e.target.closest('.nav-item'); if(!item||!dragView) return;
  e.preventDefault();
  const targetView=item.dataset.view;
  if(targetView===dragView){ document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('dragging','drag-over')); dragView=null; return; }
  const from=navOrder.indexOf(dragView), to=navOrder.indexOf(targetView);
  if(from>=0&&to>=0){ navOrder.splice(from,1); navOrder.splice(to,0,dragView); saveNavOrder(); renderNavs(); updateNavCounts(); toast('导航顺序已更新'); }
  dragView=null;
});
document.addEventListener('dragend',()=>{ document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('dragging','drag-over')); dragView=null; });

// 首页待办清单拖拽排序（仅作用于 #dashTodoList 内的条目，与导航拖拽互不干扰）
let dragTodoKey=null;
document.addEventListener('dragstart',e=>{
  const item=e.target.closest('#dashTodoList .todo-item'); if(!item) return;
  dragTodoKey=item.dataset.key||null; if(!dragTodoKey){ e.preventDefault(); return; }
  item.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragTodoKey); }catch(err){}
});
document.addEventListener('dragover',e=>{
  const item=e.target.closest('#dashTodoList .todo-item'); if(!item||!dragTodoKey) return;
  e.preventDefault();
  document.querySelectorAll('#dashTodoList .todo-item').forEach(b=>b.classList.remove('drag-over'));
  if(item.dataset.key!==dragTodoKey) item.classList.add('drag-over');
});
document.addEventListener('drop',e=>{
  const item=e.target.closest('#dashTodoList .todo-item'); if(!item||!dragTodoKey) return;
  e.preventDefault();
  const targetKey=item.dataset.key;
  if(targetKey&&targetKey!==dragTodoKey){
    // 以当前 DOM 顺序为准：移除被拖项，再插到目标项的位置，整份顺序持久化
    const keys=[...document.querySelectorAll('#dashTodoList .todo-item')].map(el=>el.dataset.key).filter(Boolean);
    const from=keys.indexOf(dragTodoKey);
    if(from>=0) keys.splice(from,1);
    const to=keys.indexOf(targetKey);
    keys.splice(to>=0?to:keys.length,0,dragTodoKey);
    todoOrder=keys; saveTodoOrder(); render(); toast('待办顺序已更新');
  }
  dragTodoKey=null;
});
document.addEventListener('dragend',()=>{ document.querySelectorAll('#dashTodoList .todo-item').forEach(b=>b.classList.remove('dragging','drag-over')); dragTodoKey=null; });

document.addEventListener('compositionend',e=>{

  /* 示例数据预览 */
  if(action==='demo-load'){ enterDemo(); return; }
  if(action==='demo-exit'){ exitDemo(); return; }
});

/* ================= 认证与启动 ================= */
function showLogin(){ $('#authLoading').classList.add('hidden'); $('#authForm').classList.remove('hidden'); $('#authScreen').classList.remove('hidden'); }
function hideLogin(){ $('#authScreen').classList.add('hidden'); }
function showLoginError(msg){ const el=$('#authError'); if(el){ el.textContent=msg||''; el.style.display=msg?'block':'none'; } }

const PROD_HOST='my-workbench-18934.app.workbuddy.host';
function checkEnvNotice(){
  const el=$('#authEnvNotice');
  if(!el) return;
  const host=location.hostname;
  if(host && host!==PROD_HOST && host!==''){
    el.innerHTML='⚠️ 你当前是在 <b>预览/本地环境</b> 中打开的页面，这里无法登录（微信授权与验证码接口只对发布后的网址开放）。<br>请在手机或电脑浏览器中打开正式网址：<br><a href="https://'+PROD_HOST+'" target="_blank" rel="noopener">https://'+PROD_HOST+'</a>';
    el.classList.remove('hidden');
  }
}

function renderUserChip(){
  const nameEl=$('#userName'), avEl=$('#userAvatar');
  if(!nameEl) return;
  let name='未登录';
  if(offlineMode){ name='离线模式'; }
  else if(currentUser){ name = currentUser.name || currentUser.email || '已登录'; }
  nameEl.textContent=name;
  if(avEl){
    if(currentUser && currentUser.avatarUrl){ avEl.innerHTML=`<img src="${esc(currentUser.avatarUrl)}" alt="">`; }
    else { avEl.textContent = offlineMode ? '离' : (name||'我').slice(0,1); }
  }
  document.querySelectorAll('.signout-btn').forEach(b=>{ b.title = offlineMode ? '去登录' : '退出登录'; });
}

async function boot(){
  window.addEventListener('storage', onPomoStorage);
  const qs=new URLSearchParams(location.search);
  if(qs.get('pomo')==='1'){ bootPomoWindow(); return; }
  // 作品预览直达：?demo=1（可加 &view=finance 指定页面），不登录、不读云端、不写任何数据
  if(qs.get('demo')==='1'){ enterDemo(); return; }
  checkEnvNotice();
  const local = readLocalState();
  // 独立版：没有云端配置就地使用，不弹登录框、不产生任何网络请求
  if(!CLOUD_CONFIG.publishableKey){ enterOffline(); return; }
  if(!window.WorkBuddyCloud){
    // SDK 未加载：给出明确错误提示，可刷新重试
    showLogin();
    showLoginError('云服务组件加载失败，可能是网络问题，请刷新重试');
    return;
  }
  cloud = WorkBuddyCloud.createWorkBuddyCloud(CLOUD_CONFIG);
  await restoreAuth(local);
}

async function restoreAuth(local){
  const url = new URL(location.href);
  if(url.searchParams.has('code') || url.searchParams.has('error')){
    const provider = url.searchParams.get('provider');
    if(provider === 'wechat'){
      try{
        const { data: session, error } = await cloud.auth.handleWechatWebCallback();
        if(error){ showLoginError(error.message); showLogin(); return; }
        if(session){ clearCallbackParams(); currentUser = session.user || null; await enterApp(local); return; }
      }catch(e){ showLoginError('微信登录失败，请重试'); showLogin(); return; }
    }
    showLoginError('授权回调无效，请重新登录');
    showLogin();
    return;
  }
  const { data: session, error } = await cloud.auth.getSession();
  if(error || !session){ showLogin(); return; }
  currentUser = session.user || null;
  await enterApp(local);
}

function clearCallbackParams(){
  const url = new URL(location.href);
  for(const k of ['code','state','provider','error']) url.searchParams.delete(k);
  history.replaceState(null, '', url.pathname + url.search + url.hash);
}

async function enterApp(local){
  hideLogin();
  renderUserChip();
  cloudReady=false;
  try{
    const cloudData = await loadCloudState();
    cloudReady=true;
    if(cloudData){ state = cloudData; }
    else if(local){ state = local; await persistCloudNow(); toast('已把本地数据同步到云端'); }
  }catch(e){
    cloudReady=false;
    console.error('[cloud load]', e && e.message ? e.message : e);
    if(local){ state = local; toast('云端读取失败，已加载本地副本'); }
    else { toast('云端读取失败，请检查网络后重试'); }
  }
  render();
}

async function signOut(){
  if(offlineMode){
    // 离线模式：返回登录屏尝试登录（不清空本地数据）
    offlineMode=false;
    renderUserChip();
    showLogin();
    return;
  }
  if(cloud){ try{ await cloud.auth.signOut(); }catch(e){} }
  currentUser=null; stateRowId=null; cloudReady=false; state=emptyState();
  renderUserChip();
  showLogin();
}

function enterOffline(){
  const local = readLocalState();
  if(local) state = local;
  currentUser=null; stateRowId=null; offlineMode=true;
  hideLogin();
  renderUserChip();
  render();
  toast('已进入离线模式，数据保存在本机浏览器');
}

/* ---- 登录按钮 ---- */
async function loginWechat(){
  showLoginError('');
  if(!cloud){ showLoginError('云服务未就绪，请刷新重试'); return; }
  const { data, error } = await cloud.auth.signInWithOAuth({ provider:'wechat', redirectTo: location.origin });
  if(error){ showLoginError(error.message); return; }
  location.assign(data.url);
}

let pendingEmailOtp = null;
let resendTimer = null;
async function sendEmailCode(){
  const email = $('#authEmail').value.trim();
  if(!email){ showLoginError('请输入邮箱地址'); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ showLoginError('请输入正确的邮箱地址'); return; }
  showLoginError('');
  const sent = await cloud.auth.sendOtp({ email });
  if(sent.error){ showLoginError(sent.error.message); return; }
  pendingEmailOtp = { email, verificationId: sent.data.verificationId, isExistingUser: sent.data.isExistingUser };
  toast('验证码已发送，请查收邮箱');
  const btn=$('#btnSendCode'); let n=60; btn.disabled=true;
  clearInterval(resendTimer);
  btn.textContent=`${n}s 后重发`;
  resendTimer=setInterval(()=>{ n--; if(n<=0){ clearInterval(resendTimer); btn.disabled=false; btn.textContent='获取验证码'; } else { btn.textContent=`${n}s 后重发`; } },1000);
}
async function submitEmailOtp(){
  const email = $('#authEmail').value.trim();
  const code = $('#authCode').value.trim();
  if(!pendingEmailOtp || pendingEmailOtp.email !== email){ showLoginError('请先获取当前邮箱的验证码'); return; }
  if(!code){ showLoginError('请输入验证码'); return; }
  showLoginError('');
  const completed = await cloud.auth.verifyOtp({ email: pendingEmailOtp.email, verificationId: pendingEmailOtp.verificationId, isExistingUser: pendingEmailOtp.isExistingUser, token: code });
  if(completed.error){ showLoginError(completed.error.message); return; }
  pendingEmailOtp = null;
  currentUser = (completed.data && completed.data.user) || null;
  await enterApp(readLocalState());
}
$('#btnWechat').addEventListener('click', loginWechat);
$('#btnSendCode').addEventListener('click', sendEmailCode);
$('#btnEmailLogin').addEventListener('click', submitEmailOtp);
$('#btnOffline').addEventListener('click', enterOffline);
$('#btnDemo').addEventListener('click', ()=>enterDemo());

boot();
</script>
